# Deploy manifests for LT-34/LT-45/LT-47's vertical slice, extended in
# LT-32 for the issuer Deployment split (F13's fix) and LT-52 for a real
# Postgres instance, the migration Job, and DB_DSN_FILE wiring into
# api-service. No CockroachDB deployment here — CI-only (LT-47), per
# LT-52's stated scope limit.
#
# No Namespace object here, deliberately: the scoped loginid-takehome-deployer
# ServiceAccount's RBAC (deploy/rbac.yaml) is namespace-scoped to
# loginid-takehome and correctly cannot get/create/patch a cluster-scoped
# Namespace object — that's the isolation working as designed, not a gap.
# The namespace itself is created once, out of band, by whoever runs the
# initial cluster bootstrap (deploy/rbac.yaml also creates
# loginid-takehome-runners for the same reason).
#
# No Secret object here either, and none ever will be for the JWT signing
# key specifically: deploy/rbac.yaml's Role grants nothing on `secrets` at
# all, so an attempt to apply one here would fail Forbidden, the same way
# Namespace did. The signing-key Secret is created out-of-band — see
# deploy/issuer-secret-bootstrap.yaml — per Tobias's (01) accepted
# objection on LT-32's refinement: the CI-applied manifest set must never
# be the thing that can read or write that key.
apiVersion: v1
kind: ServiceAccount
metadata: {name: api-service, namespace: loginid-takehome}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: api-service-issuer, namespace: loginid-takehome}
---
# postgres/db-migrate/idp-connector ServiceAccounts (LT-46): Amber's Vault
# provisioning found all three workloads declared no serviceAccountName
# at all and ran as `default` — a hard blocker, not a style gap, since
# binding a Vault Kubernetes-auth role to `default` would let ANY pod on
# that SA assume it (idp-connector could have authenticated as
# loginid-takehome-postgres and read postgres-superuser). Amber created
# these three SAs directly rather than bind to default; declared here so
# they're part of the same CI-applied, reviewable manifest set as every
# other ServiceAccount in this namespace, not a hand-applied one-off.
apiVersion: v1
kind: ServiceAccount
metadata: {name: postgres, namespace: loginid-takehome}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: db-migrate, namespace: loginid-takehome}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: idp-connector, namespace: loginid-takehome}
---
apiVersion: v1
kind: ResourceQuota
metadata: {name: loginid-takehome-quota, namespace: loginid-takehome}
spec:
  # Quota math (LT-52 adds Postgres + a transient migration Job pod;
  # LT-51 adds the issuer database in the same Postgres instance and the
  # migration Job's third invocation — no new pods, no change to the
  # numbers below beyond what LT-52 already established. api-service-
  # issuer's replicas dropped 2 -> 1 per Helena's (02) ruling, and
  # api-service's own replicas dropped 2 -> 1 per Naomi's (01) live
  # review — RateLimiter/TouchCounter/GrantLimiter are all in-process,
  # per-pod state; a 12-request burst passed a 10 req/min limit because
  # the load balancer split it across two pods, each with its own
  # independent counter. Both reductions only tighten headroom further,
  # never loosen it. LT-44 adds one more transient pod (retention-sweep,
  # 100m/128Mi requests, 500m/256Mi limits) — same shape as the
  # migration Job, never running concurrently with anything unusual
  # since it's a daily off-peak CronJob, not a per-deploy one):
  #   requests.cpu:    700m existing (incl. postgres+migrate) + sweep 100m = 800m  (limit "1" = 1000m, fits)
  #   requests.memory: 1024Mi existing + sweep 128Mi = 1152Mi (limit 2Gi, fits)
  #   limits.cpu:      3450m existing + sweep 500m = 3950m (limit "4" = 4000m — fits, but only 50m of
  #                    headroom left; the NEXT thing added here needs to either bump this limit or trim
  #                    an existing one, not assume there's still room)
  #   limits.memory:   2048Mi existing + sweep 256Mi = 2304Mi (limit 3Gi, fits)
  #   pods: 8 existing (incl. postgres+migrate transient) + sweep 1 (transient) = 9, fits under 10
  # Shown here, not discovered as a second FailedCreate, per the standing
  # checklist in containerization-design.md §5a.
  #
  # HOTFIX (live incident, deploy 34772376569): postgres's StatefulSet
  # pod FailedCreate — "exceeded quota, requested: requests.cpu=350m"
  # against the 1000m hard limit, with 750m already used by
  # api-service/api-service-issuer's Vault-init-container-inflated
  # pods. Root cause: the Vault Agent Injector's own DEFAULT per-
  # container resources (requests 250m cpu/64Mi mem, limits 500m
  # cpu/128Mi mem) were never accounted for in the math above — every
  # injected workload silently carried an extra 250m cpu request this
  # comment never priced in, and the default sidecar mode (since
  # corrected to pre-populate-only, see each workload's own hotfix
  # comment) meant that 250m was a PERSISTENT container's request, not
  # a transient init-only one. With this hotfix's explicit small agent
  # resources (10m/16Mi request, 100m/64Mi limit per injected
  # workload) and pre-populate-only everywhere, each injected
  # workload's own already-larger container requests/limits dominate
  # Kubernetes' max(init containers, regular containers) calculation
  # in every dimension — verified by hand for api-service,
  # api-service-issuer, postgres, and db-migrate — so the four
  # currently-deployed injected workloads' actual quota consumption is
  # UNCHANGED from the numbers above once this hotfix lands; nothing
  # about their addition required a quota bump on its own.
  # requests.cpu/pods raised anyway on the PM's explicit instruction,
  # as forward headroom for LT-44's retention-sweep CronJob (#57, not
  # yet merged) landing alongside these five workloads plus the
  # migrate Job, not because today's four workloads need it.
  hard:
    requests.cpu: "1500m"
    requests.memory: 2Gi
    limits.cpu: "4"
    limits.memory: 3Gi
    pods: "12"
---
# api-service's Deployment/Service live in deploy/api-service.yaml, not
# here, and are deliberately applied by the deploy workflow AFTER
# deploy/manifests.yaml (Postgres + the migration Job) and after the
# migration Job completes — LT-52's requirement that the schema exists
# before api-service starts trying to use it. Nothing else in this file
# needs that ordering; api-service is the one thing that does.
#
# api-service-issuer: the ONLY Deployment that mounts the JWT signing key
# (F13's fix, per handoff-04-secrets.md row #2 and
# containerization-design.md's "Why two Deployments of one image, not RBAC
# on one"). Same image as api-service, mode selected by APP_MODE.
#
# replicas: 1, not 2 — per Helena's (02) LT-51 review: GrantLimiter
# (internal/api, wired around the client-credentials grant) tracks
# failed-attempt state in-process, per-pod. Two replicas behind
# round-robin means an attacker's failures split across both, silently
# halving the limiter's effective threshold before it engages — a real
# security regression, not a cosmetic one. This POC issuer has no HA
# requirement that would justify accepting that.
#
# strategy: Recreate, not the RollingUpdate default — same reasoning as
# api-service's Deployment (deploy/api-service.yaml): the default
# maxSurge briefly runs two pods during a rollout, reopening the
# cross-replica limiter gap once per deploy. Recreate accepts a brief
# availability gap instead, consistent with treating the in-process
# limiters here as security controls that assume one pod.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-service-issuer
  namespace: loginid-takehome
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: api-service-issuer}}
  template:
    metadata:
      labels: {app: api-service-issuer}
      annotations:
        # LT-46: Vault Agent Injector, per Amber's provisioning
        # (04-infra-devops/handoff-amber-vault-provisioning.md).
        # JWT_SIGNING_KEY_FILE/ISSUER_DB_DSN_FILE below are UNCHANGED —
        # per-secret secret-volume-path overrides render to those exact
        # paths, no application config change. Single-line templates
        # (Amber's verified trailing-newline trap); ca-cert, not
        # tls-skip-verify, per her/the PM's recommendation.
        #
        # HOTFIX (live incident, deploy 34772376569): Init:CrashLoopBackOff
        # on this exact Deployment — "Error loading CA File: open
        # /vault/custom/vault-ca-cert/ca.crt: no such file or directory".
        # agent-extra-secret mounts a Secret's keys directly at
        # /vault/custom/, not /vault/custom/<secret-name>/ — path
        # corrected. pre-populate-only + small explicit agent resources
        # added for the same reason as api-service (see that Deployment's
        # own comment in deploy/api-service.yaml): static, non-rotated
        # values, no sidecar needed, and the injector's 250m/64Mi default
        # request was what pushed the namespace over its requests.cpu quota.
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/agent-pre-populate-only: "true"
        vault.hashicorp.com/agent-requests-cpu: "10m"
        vault.hashicorp.com/agent-limits-cpu: "100m"
        vault.hashicorp.com/agent-requests-mem: "16Mi"
        vault.hashicorp.com/agent-limits-mem: "64Mi"
        vault.hashicorp.com/role: "loginid-takehome-api-service-issuer"
        vault.hashicorp.com/agent-extra-secret: "vault-ca-cert"
        vault.hashicorp.com/ca-cert: "/vault/custom/ca.crt"
        vault.hashicorp.com/agent-inject-secret-jwt-key: "secret/data/loginid-takehome/api-service-jwt-signing-key"
        vault.hashicorp.com/secret-volume-path-jwt-key: "/secrets/jwt"
        vault.hashicorp.com/agent-inject-file-jwt-key: "signing-key"
        # index, not dot-notation, for the "signing-key" map key: Go
        # templates parse a bare `.Data.data.signing-key` as subtraction
        # (`.Data.data.signing` MINUS `key`), not a hyphenated field
        # access — caught before deploy, not after a CrashLoopBackOff.
        vault.hashicorp.com/agent-inject-template-jwt-key: |
          {{- with secret "secret/data/loginid-takehome/api-service-jwt-signing-key" -}}{{ index .Data.data "signing-key" }}{{- end -}}
        vault.hashicorp.com/agent-inject-secret-issuer-dsn: "secret/data/loginid-takehome/issuer-db-runtime-credential"
        vault.hashicorp.com/secret-volume-path-issuer-dsn: "/secrets/issuer-db"
        vault.hashicorp.com/agent-inject-file-issuer-dsn: "dsn"
        vault.hashicorp.com/agent-inject-template-issuer-dsn: |
          {{- with secret "secret/data/loginid-takehome/issuer-db-runtime-credential" -}}{{ .Data.data.dsn }}{{- end -}}
    spec:
      serviceAccountName: api-service-issuer
      securityContext: {runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532}
      containers:
        - name: api-service
          image: ghcr.io/wtvamp/loginid-takehome/api-service:IMAGE_TAG
          securityContext: {readOnlyRootFilesystem: true}
          resources:
            requests: {cpu: "100m", memory: "128Mi"}
            limits: {cpu: "500m", memory: "256Mi"}
          env:
            - {name: HTTP_ADDR, value: ":8080"}
            - {name: APP_MODE, value: issuer}
            - {name: JWT_SIGNING_KEY_FILE, value: /secrets/jwt/signing-key}
            - {name: ISSUER_DB_DSN_FILE, value: /secrets/issuer-db/dsn}
            - {name: AUTH_JWT_ISSUER, value: "https://auth.loginid-takehome.internal"}
            - {name: AUTH_JWT_AUDIENCE, value: "loginid-api-service"}
          readinessProbe: {httpGet: {path: /healthz, port: 8080}, initialDelaySeconds: 5}
          livenessProbe: {httpGet: {path: /healthz, port: 8080}, initialDelaySeconds: 10}
---
apiVersion: v1
kind: Service
metadata: {name: api-service-issuer, namespace: loginid-takehome}
spec:
  selector: {app: api-service-issuer}
  ports: [{port: 443, targetPort: 8080}]
---
# --- Postgres (LT-52) ---
#
# ConfigMap holding the initdb script that creates the migrator/runtime
# roles the first time Postgres initializes an empty PVC. Safe to be
# CI-applied (no secret material) — the passwords it interpolates come
# from Secret env vars at container start, never written into this
# ConfigMap itself.
#
# CAVEAT — the same class as the sequences/UUID note below, stated up
# front rather than rediscovered: docker-entrypoint-initdb.d scripts run
# ONLY on an empty $PGDATA (Postgres's own first-init behavior, not a
# choice this manifest makes). Once a PVC has been initialized, editing
# these scripts changes nothing on the live instance — a future edit
# here (a new role, a new grant, a new database) has to be hand-applied
# against the running instance too, the same way the issuer
# database/roles below were (see deploy/db-secret-bootstrap.yaml's
# "Hand-apply procedure used for LT-51" section for the exact commands
# that were actually run, and the note there on the better long-term
# shape this should eventually become).
apiVersion: v1
kind: ConfigMap
metadata: {name: postgres-initdb, namespace: loginid-takehome}
data:
  01-create-roles.sh: |
    #!/bin/bash
    set -euo pipefail
    # LT-46: MIGRATOR_PASSWORD/RUNTIME_PASSWORD are no longer container
    # env vars (postgres's own env block only sets POSTGRES_PASSWORD_FILE
    # now — see deploy/manifests.yaml's postgres StatefulSet) — read
    # directly from the files Vault Agent renders them to instead. Read
    # once into a shell var rather than inline `$(cat ...)` inside the
    # heredoc so a read failure (file missing/empty) trips `set -e`
    # immediately, before any SQL runs, rather than embedding an empty
    # string into a CREATE ROLE statement silently.
    MIGRATOR_PASSWORD="$(cat /vault/secrets/db-migrator-credential)"
    RUNTIME_PASSWORD="$(cat /vault/secrets/db-runtime-credential)"
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" <<-EOSQL
      CREATE ROLE migrator WITH LOGIN PASSWORD '$MIGRATOR_PASSWORD' CREATEDB;
      GRANT ALL PRIVILEGES ON DATABASE $POSTGRES_DB TO migrator;
      -- Postgres 15+ revoked PUBLIC's implicit CREATE on the public
      -- schema — database-level privileges above don't cover schema-level
      -- ones. Without this, migrator's own CREATE TABLE fails with
      -- "permission denied for schema public" (verified against a live
      -- postgres:16-alpine container by 01/Naomi — this would have broken
      -- the first real deploy).
      GRANT CREATE ON SCHEMA public TO migrator;
      CREATE ROLE runtime WITH LOGIN PASSWORD '$RUNTIME_PASSWORD';
      GRANT CONNECT ON DATABASE $POSTGRES_DB TO runtime;
      -- runtime gets DML on tables migrator creates from now on, without
      -- needing to know table names in advance and without ordering this
      -- after the migration Job runs — Postgres 15+ default privileges no
      -- longer grant CREATE on the public schema to non-owners, so
      -- runtime genuinely cannot run DDL (LT-52's acceptance criterion).
      --
      -- CAVEAT, stated rather than discovered later: this ALTER DEFAULT
      -- PRIVILEGES clause is scoped to ON TABLES only — it grants nothing
      -- on sequences. The current schema is UUID-keyed throughout (per
      -- 05-data-ops/multi-db-strategy.md), so no column depends on a
      -- SERIAL/IDENTITY sequence and this gap is currently inert. If a
      -- future migration ever adds a SERIAL/IDENTITY column, runtime
      -- would silently be unable to insert into that table (no USAGE on
      -- its sequence) until a matching `... ON SEQUENCES ...` grant is
      -- added here — this is the first place to look if that happens.
      ALTER DEFAULT PRIVILEGES FOR ROLE migrator IN SCHEMA public
        GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO runtime;
    EOSQL
  02-create-issuer-db.sh: |
    #!/bin/bash
    set -euo pipefail
    # LT-51: the token issuer's client store is a separate `issuer`
    # database in this same Postgres instance (Priya's ruling — a
    # distinct database, not just a distinct schema, makes a
    # cross-database join to user_profile/user_credential structurally
    # impossible, not merely policy-forbidden). Same migrator/runtime
    # role-split discipline as the main database, carried over rather
    # than rediscovered — including the CREATE ON SCHEMA public grant
    # that LT-52 already had to learn the hard way.
    #
    # CREATE DATABASE must be the ONLY statement in its query — verified
    # empirically against a real container: psql sends a multi-statement
    # -c/heredoc string as one simple-query protocol message, which
    # Postgres wraps in an implicit transaction block, and CREATE DATABASE
    # cannot run inside any transaction block, explicit or implicit
    # ("CREATE DATABASE cannot run inside a transaction block") — even
    # when it's the first of several statements targeting a database
    # other than itself. Its own invocation, alone, then a separate one
    # for the roles (roles are cluster-wide, not per-database), then a
    # third reconnecting to `issuer` for the database-and-schema-scoped
    # grants.
    # LT-46: same file-not-env-var change as 01-create-roles.sh.
    ISSUER_MIGRATOR_PASSWORD="$(cat /vault/secrets/issuer-db-migrator-credential)"
    ISSUER_RUNTIME_PASSWORD="$(cat /vault/secrets/issuer-db-runtime-credential)"
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" -c "CREATE DATABASE issuer;"
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" <<-EOSQL
      CREATE ROLE issuer_migrator WITH LOGIN PASSWORD '$ISSUER_MIGRATOR_PASSWORD' CREATEDB;
      CREATE ROLE issuer_runtime WITH LOGIN PASSWORD '$ISSUER_RUNTIME_PASSWORD';
    EOSQL
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname issuer <<-EOSQL
      GRANT ALL PRIVILEGES ON DATABASE issuer TO issuer_migrator;
      GRANT CREATE ON SCHEMA public TO issuer_migrator;
      GRANT CONNECT ON DATABASE issuer TO issuer_runtime;
      ALTER DEFAULT PRIVILEGES FOR ROLE issuer_migrator IN SCHEMA public
        GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO issuer_runtime;
    EOSQL
---
# Self-signed Issuer + Certificate for Postgres's server TLS, per
# Marcus's (02) ruling on threat-model.md Assumption 9: PII crosses this
# connection, and this track already requires TLS for the same PII one
# hop earlier (client-facing), so plaintext one hop later on a shared
# cluster with unverified network isolation would be inconsistent.
# letsencrypt-prod (used by the public Ingress) can't issue for an
# internal-only DNS name — self-signed is sufficient here because the
# client uses sslmode=require, not verify-full (NetworkPolicy already
# restricts *who* can reach the DB Service; TLS covers *what's on the
# wire*, not identity verification, per Marcus's own scoping of what this
# hop needs).
apiVersion: cert-manager.io/v1
kind: Issuer
metadata: {name: postgres-selfsigned, namespace: loginid-takehome}
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata: {name: postgres-server-tls, namespace: loginid-takehome}
spec:
  secretName: postgres-server-tls
  issuerRef: {name: postgres-selfsigned, kind: Issuer}
  dnsNames:
    - postgres.loginid-takehome.svc.cluster.local
    - postgres.loginid-takehome.svc
    - postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: postgres, namespace: loginid-takehome}
spec:
  serviceName: postgres
  replicas: 1
  selector: {matchLabels: {app: postgres}}
  template:
    metadata:
      labels: {app: postgres}
      annotations:
        # LT-46: Vault Agent Injector, per Amber's provisioning. Widest
        # role of the five (loginid-takehome-postgres) — all five files
        # land at the default /vault/secrets/<name> base, matching
        # exactly what 01-create-roles.sh/02-create-issuer-db.sh and
        # POSTGRES_PASSWORD_FILE below already read.
        #
        # HOTFIX (live incident, deploy 34772376569): this StatefulSet's
        # own Pod is what actually FailedCreate'd —
        # "exceeded quota loginid-takehome-quota, requested:
        # requests.cpu=350m" once its Vault init container's default
        # 250m request stacked on top of api-service/api-service-issuer's
        # own sidecars already having pushed the namespace to 750m of the
        # 1000m hard limit. pre-populate-only + small explicit agent
        # resources, same as the other three workloads — postgres reads
        # its five passwords once at container start (01-create-roles.sh/
        # 02-create-issuer-db.sh/POSTGRES_PASSWORD_FILE), never again, so
        # a persistent sidecar had nothing to renew. ca-cert path
        # corrected (agent-extra-secret mounts at /vault/custom/ directly,
        # not /vault/custom/<secret-name>/).
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/agent-pre-populate-only: "true"
        vault.hashicorp.com/agent-requests-cpu: "10m"
        vault.hashicorp.com/agent-limits-cpu: "100m"
        vault.hashicorp.com/agent-requests-mem: "16Mi"
        vault.hashicorp.com/agent-limits-mem: "64Mi"
        vault.hashicorp.com/role: "loginid-takehome-postgres"
        vault.hashicorp.com/agent-extra-secret: "vault-ca-cert"
        vault.hashicorp.com/ca-cert: "/vault/custom/ca.crt"
        vault.hashicorp.com/agent-inject-secret-postgres-superuser: "secret/data/loginid-takehome/postgres-superuser"
        vault.hashicorp.com/agent-inject-template-postgres-superuser: |
          {{- with secret "secret/data/loginid-takehome/postgres-superuser" -}}{{ .Data.data.password }}{{- end -}}
        vault.hashicorp.com/agent-inject-secret-db-migrator-credential: "secret/data/loginid-takehome/db-migrator-credential"
        vault.hashicorp.com/agent-inject-template-db-migrator-credential: |
          {{- with secret "secret/data/loginid-takehome/db-migrator-credential" -}}{{ .Data.data.password }}{{- end -}}
        vault.hashicorp.com/agent-inject-secret-db-runtime-credential: "secret/data/loginid-takehome/db-runtime-credential"
        vault.hashicorp.com/agent-inject-template-db-runtime-credential: |
          {{- with secret "secret/data/loginid-takehome/db-runtime-credential" -}}{{ .Data.data.password }}{{- end -}}
        vault.hashicorp.com/agent-inject-secret-issuer-db-migrator-credential: "secret/data/loginid-takehome/issuer-db-migrator-credential"
        vault.hashicorp.com/agent-inject-template-issuer-db-migrator-credential: |
          {{- with secret "secret/data/loginid-takehome/issuer-db-migrator-credential" -}}{{ .Data.data.password }}{{- end -}}
        vault.hashicorp.com/agent-inject-secret-issuer-db-runtime-credential: "secret/data/loginid-takehome/issuer-db-runtime-credential"
        vault.hashicorp.com/agent-inject-template-issuer-db-runtime-credential: |
          {{- with secret "secret/data/loginid-takehome/issuer-db-runtime-credential" -}}{{ .Data.data.password }}{{- end -}}
    spec:
      serviceAccountName: postgres
      # postgres:16-alpine's image defaults to root (its entrypoint drops
      # to the postgres user internally via gosu when started as root) —
      # runAsNonRoot alone fails with "container has runAsNonRoot and
      # image will run as root" without an explicit numeric runAsUser, the
      # same class of bug as LT-45's distroless fix. Verified the actual
      # UID/GID directly (`docker run --entrypoint getent ... passwd
      # postgres` -> uid 70, not the commonly-assumed 999) rather than
      # guessing — confirmed the entrypoint runs correctly when started
      # already as UID 70 (skips its own root-detection branch).
      securityContext: {runAsNonRoot: true, runAsUser: 70, runAsGroup: 70, fsGroup: 70}
      containers:
        - name: postgres
          image: postgres:16-alpine
          # ssl_key_file must not be group/world-readable or postgres
          # refuses to start; cert-manager's Secret mounts default to
          # 0644, so defaultMode below + fsGroup above are what make this
          # actually work, not just "a cert exists".
          args:
            - -c
            - ssl=on
            - -c
            - ssl_cert_file=/certs/tls.crt
            - -c
            - ssl_key_file=/certs/tls.key
          resources:
            requests: {cpu: "100m", memory: "256Mi"}
            limits: {cpu: "500m", memory: "512Mi"}
          # LT-46: postgres-superuser also moved to Vault (per the PM's
          # ruling) — the earlier bootstrap-ordering exception no longer
          # holds, since Vault runs before Postgres ever starts on this
          # cluster. POSTGRES_PASSWORD_FILE below (Docker Official
          # postgres image's own documented alternative to
          # POSTGRES_PASSWORD) and the four role passwords
          # 01-create-roles.sh/02-create-issuer-db.sh read from files
          # are both delivered by this pod's Vault Agent Injector
          # annotations above.
          env:
            - {name: POSTGRES_USER, value: postgres}
            - {name: POSTGRES_DB, value: loginid}
            - {name: POSTGRES_PASSWORD_FILE, value: /vault/secrets/postgres-superuser}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          ports: [{containerPort: 5432}]
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: initdb, mountPath: /docker-entrypoint-initdb.d, readOnly: true}
            - {name: server-tls, mountPath: /certs, readOnly: true}
          readinessProbe: {exec: {command: [pg_isready, -U, postgres]}, initialDelaySeconds: 5, periodSeconds: 5}
          livenessProbe: {exec: {command: [pg_isready, -U, postgres]}, initialDelaySeconds: 10, periodSeconds: 10}
      volumes:
        - name: initdb
          configMap: {name: postgres-initdb, defaultMode: 0555}
        - name: server-tls
          secret: {secretName: postgres-server-tls, defaultMode: 0600}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: 2Gi}}
---
apiVersion: v1
kind: Service
metadata: {name: postgres, namespace: loginid-takehome}
spec:
  clusterIP: None # headless — StatefulSet stable network identity
  selector: {app: postgres}
  ports: [{port: 5432, targetPort: 5432}]
---
# Postgres holds real PII at rest — the first component in this namespace
# that does. Reachable only from api-service and the migration Job's own
# pod (labeled app: db-migrate), matching idp-connector-default-deny's
# shape. Nothing else in the namespace, and nothing outside it, can reach
# port 5432 on this pod.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: postgres-default-deny, namespace: loginid-takehome}
spec:
  podSelector: {matchLabels: {app: postgres}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - {podSelector: {matchLabels: {app: api-service}}}
        - {podSelector: {matchLabels: {app: api-service-issuer}}}
        - {podSelector: {matchLabels: {app: db-migrate}}}
---
# Migration Job: three goose invocations, each against its own version
# table. Main-database pair first — backend directory then shared/
# (Priya's corrected order: shared/ holds only the auth_method seed row,
# which depends on auth_method existing, which the backend DDL creates)
# — then the issuer database LAST (LT-51), since it has no ordering
# dependency on the main database's migrations at all; running it last
# is simplest, not required by any dependency. All three must succeed or
# the Job fails; idempotent by construction (goose skips already-applied
# versions). Runs to completion before api-service's rollout — sequenced
# by the deploy workflow (kubectl wait for this Job's completion before
# applying api-service's Deployment), not by an assumption about
# scheduling order.
apiVersion: batch/v1
kind: Job
metadata: {name: db-migrate, namespace: loginid-takehome}
spec:
  backoffLimit: 2
  template:
    # agent-pre-populate-only (LT-46 prep): this pod runs to completion
    # and exits, unlike api-service/api-service-issuer/postgres — a
    # long-lived Vault Agent sidecar here would never be reaped (Jobs
    # don't get one killed off automatically the way a Deployment's
    # rollout would), so the init-container-only delivery mode is the
    # correct one, not the default sidecar mode. Inert until the real
    # vault.hashicorp.com/agent-inject + role + path annotations land
    # (Amber's provisioning) — pre-populate-only has no effect unless
    # agent-inject is also enabled. Added now since it needs no
    # project-specific name to state correctly.
    metadata:
      labels: {app: db-migrate}
      annotations:
        vault.hashicorp.com/agent-pre-populate-only: "true"
        # LT-46: Vault Agent Injector, per Amber's provisioning. Both
        # dsn keys land at the default /vault/secrets/<name> base,
        # matching exactly what the migrate container's command reads
        # below.
        #
        # HOTFIX (live incident, deploy 34772376569): small explicit
        # agent resources added, same reasoning as the other three
        # workloads (this Job's own init container was already the
        # smallest consumer here, but consistency matters for the next
        # reader trying to audit total quota impact by eye). ca-cert
        # path corrected (agent-extra-secret mounts at /vault/custom/
        # directly, not /vault/custom/<secret-name>/).
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/agent-requests-cpu: "10m"
        vault.hashicorp.com/agent-limits-cpu: "100m"
        vault.hashicorp.com/agent-requests-mem: "16Mi"
        vault.hashicorp.com/agent-limits-mem: "64Mi"
        vault.hashicorp.com/role: "loginid-takehome-db-migrate"
        vault.hashicorp.com/agent-extra-secret: "vault-ca-cert"
        vault.hashicorp.com/ca-cert: "/vault/custom/ca.crt"
        vault.hashicorp.com/agent-inject-secret-db-migrator-credential-dsn: "secret/data/loginid-takehome/db-migrator-credential"
        vault.hashicorp.com/agent-inject-template-db-migrator-credential-dsn: |
          {{- with secret "secret/data/loginid-takehome/db-migrator-credential" -}}{{ .Data.data.dsn }}{{- end -}}
        vault.hashicorp.com/agent-inject-secret-issuer-db-migrator-credential-dsn: "secret/data/loginid-takehome/issuer-db-migrator-credential"
        vault.hashicorp.com/agent-inject-template-issuer-db-migrator-credential-dsn: |
          {{- with secret "secret/data/loginid-takehome/issuer-db-migrator-credential" -}}{{ .Data.data.dsn }}{{- end -}}
    spec:
      serviceAccountName: db-migrate
      restartPolicy: Never
      # Story 8 (backlog.md): the first real deploy's migrate attempt
      # hit "lookup postgres.loginid-takehome.svc ... no such host" —
      # the StatefulSet reported Ready before the headless Service's DNS
      # record had actually propagated. The Job's own backoffLimit
      # absorbed it (2nd attempt succeeded), so this is closing a race
      # rather than fixing a live failure. initContainer, not a change
      # to the main container's command: keeps the goose invocation
      # order/logic in the main container untouched, and reuses the
      # migrate image itself (alpine base, already has nc/getent) rather
      # than pulling in a second image just for this.
      initContainers:
        - name: wait-for-postgres
          image: ghcr.io/wtvamp/loginid-takehome/migrate:IMAGE_TAG
          command:
            - sh
            - -c
            - |
              set -e
              until getent hosts postgres && nc -z -w2 postgres 5432; do
                echo "waiting for postgres DNS/TCP..."
                sleep 1
              done
              echo "postgres is reachable"
          resources:
            requests: {cpu: "10m", memory: "16Mi"}
            limits: {cpu: "50m", memory: "32Mi"}
      containers:
        - name: migrate
          image: ghcr.io/wtvamp/loginid-takehome/migrate:IMAGE_TAG
          resources:
            requests: {cpu: "50m", memory: "64Mi"}
            limits: {cpu: "200m", memory: "128Mi"}
          # LT-46: goose reads its DSN from an env var deliberately (not
          # argv, to keep it out of `ps`), but Vault Agent Injector
          # writes secret material to FILES — read each rendered file's
          # content into a shell var right before the goose invocation
          # that needs it, same pattern as
          # 01-create-roles.sh/02-create-issuer-db.sh.
          env:
            - name: GOOSE_DRIVER
              value: postgres
          command:
            - sh
            - -c
            - |
              set -e
              GOOSE_DBSTRING="$(cat /vault/secrets/db-migrator-credential-dsn)" GOOSE_MIGRATION_DIR=/migrations/postgres goose -table goose_db_version_postgres up
              GOOSE_DBSTRING="$(cat /vault/secrets/db-migrator-credential-dsn)" GOOSE_MIGRATION_DIR=/migrations/shared goose -table goose_db_version_shared up
              GOOSE_DBSTRING="$(cat /vault/secrets/issuer-db-migrator-credential-dsn)" GOOSE_MIGRATION_DIR=/migrations/issuer goose -table goose_db_version_issuer up
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: idp-connector
  namespace: loginid-takehome
spec:
  replicas: 1
  selector: {matchLabels: {app: idp-connector}}
  template:
    metadata: {labels: {app: idp-connector}}
    spec:
      # serviceAccountName (LT-46): Amber created a dedicated SA rather
      # than let this Deployment run as `default` — its Vault role
      # (loginid-takehome-idp-connector) currently grants nothing (no
      # agent-inject annotations here yet), existing only so a future
      # LT-33 need (connector-client-credential, currently unpopulated —
      # Vault returns 404, not 403, for it) has a role to attach to
      # without a second provisioning round-trip.
      serviceAccountName: idp-connector
      securityContext: {runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532}
      containers:
        - name: idp-connector
          image: ghcr.io/wtvamp/loginid-takehome/idp-connector:IMAGE_TAG
          securityContext: {readOnlyRootFilesystem: true}
          resources:
            requests: {cpu: "50m", memory: "64Mi"}
            limits: {cpu: "250m", memory: "128Mi"}
          env:
            - {name: HTTP_ADDR, value: ":8081"}
            - {name: CONNECTOR_JWT_AUDIENCE, value: "idp-connector-service"}
            # AUTH_JWKS_URL/AUTH_JWT_ISSUER were missing entirely — the
            # third instance of this enforcement-site class (after the
            # AUTH_JWT_* gap fixed for api-service/api-service-issuer,
            # and the :443 port gap fixed in PR #43): NewConnectorRouter
            # builds its JWKS cache from cfg.AuthJWKSURL and its
            # middleware from cfg.AuthJWTIssuer the same way
            # NewVerifierRouter does, but nothing had ever set either
            # here. Found live: every /auth and /identity call 401'd,
            # connector log showed "JWKS fetch failed (host=, ...)
            # unsupported protocol scheme \"\"" — an empty AuthJWKSURL
            # parses to no scheme at all. Same literal values
            # api-service.yaml uses: same issuer, same JWKS endpoint,
            # same :443 (the issuer Service's only exposed port — see
            # api-service.yaml's own comment on why the port is
            # explicit). NetworkPolicy already admits
            # idp-connector -> api-service-issuer ingress; no policy
            # change needed.
            - {name: AUTH_JWKS_URL, value: "http://api-service-issuer.loginid-takehome.svc.cluster.local:443/.well-known/jwks.json"}
            - {name: AUTH_JWT_ISSUER, value: "https://auth.loginid-takehome.internal"}
          readinessProbe: {httpGet: {path: /healthz, port: 8081}, initialDelaySeconds: 5}
          livenessProbe: {httpGet: {path: /healthz, port: 8081}, initialDelaySeconds: 10}
---
apiVersion: v1
kind: Service
metadata: {name: idp-connector, namespace: loginid-takehome}
spec:
  selector: {app: idp-connector}
  ports: [{port: 443, targetPort: 8081}]
---
# idp-connector accepts ingress only from api-service — no inbound Service
# on the public Ingress reaches it, and the namespace default is allow, not
# deny, on this shared cluster, per decisions/deploy-path.md.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: idp-connector-default-deny, namespace: loginid-takehome}
spec:
  podSelector: {matchLabels: {app: idp-connector}}
  policyTypes: [Ingress]
  ingress:
    - from: [{podSelector: {matchLabels: {app: api-service}}}]
---
# api-service-issuer serves: (a) JWKS, in-cluster only, no Ingress route
# for it — internal callers reach it via the ClusterIP Service directly;
# (b) the reserved /auth/token path, which the Ingress below DOES route
# publicly. Without this policy the pod would be reachable from anything
# in the namespace (default is allow, not deny). Two allowed sources:
# api-service/idp-connector (JWKS), and the ingress-nginx-controller
# namespace (so the public /auth/token route in the Ingress below still
# works — that traffic arrives from ingress-nginx's pod, not api-service's).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: api-service-issuer-default-deny, namespace: loginid-takehome}
spec:
  podSelector: {matchLabels: {app: api-service-issuer}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - {podSelector: {matchLabels: {app: api-service}}}
        - {podSelector: {matchLabels: {app: idp-connector}}}
        - {namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: ingress-nginx}}}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: loginid-takehome
  namespace: loginid-takehome
  annotations: {cert-manager.io/cluster-issuer: letsencrypt-prod}
spec:
  ingressClassName: nginx
  tls:
    - hosts: [loginid-takehome.uplifttech.org]
      secretName: loginid-takehome-tls
  rules:
    - host: loginid-takehome.uplifttech.org
      http:
        paths:
          - {path: /healthz, pathType: Exact, backend: {service: {name: api-service, port: {number: 443}}}}
          - {path: /auth/token, pathType: Exact, backend: {service: {name: api-service-issuer, port: {number: 443}}}}
          # POST /profiles/search, GET /profiles/{id} (internal/app/verifier_router.go)
          # — LT-39's protected routes were wired into the binary at
          # b857b40 but never added here, so they 404'd from
          # ingress-nginx's default backend, not from the app's own auth
          # middleware. JWKS (/.well-known/jwks.json) deliberately has NO
          # rule here — in-cluster only, per handoff-03-auth v6.
          - {path: /profiles, pathType: Prefix, backend: {service: {name: api-service, port: {number: 443}}}}
---
# LT-44 (S11): retention sweep. Own ServiceAccount, per the same
# one-workload-one-identity discipline Amber's LT-46 provisioning
# established for postgres/db-migrate/idp-connector — this pod reads
# the same db-runtime-credential DSN api-service already does (Renata
# confirmed the sweep needs nothing else: DeleteExpired/DeleteProfile
# run under the runtime role, which already has DELETE per
# 01-create-roles.sh's ALTER DEFAULT PRIVILEGES grant), but it's a
# distinct workload on a distinct schedule, not the same pod — sharing
# api-service's own ServiceAccount would mean either identity could
# authenticate to Vault as the other.
#
# TODO(LT-44, blocked on Amber): this needs a sixth Vault
# Kubernetes-auth role, loginid-takehome-retention-sweep, bound to the
# retention-sweep ServiceAccount below, read-only on the EXISTING
# secret/loginid-takehome/db-runtime-credential path (no new KV entry —
# same credential api-service's own role already reads). Vault
# annotations aren't added here yet for the same reason as everywhere
# else in this file before Amber's names landed: a fabricated role
# name is worse than an obviously-missing one.
apiVersion: v1
kind: ServiceAccount
metadata: {name: retention-sweep, namespace: loginid-takehome}
---
apiVersion: batch/v1
kind: CronJob
metadata: {name: retention-sweep, namespace: loginid-takehome}
spec:
  # Daily, 03:00 UTC — off-peak for this take-home's traffic pattern,
  # comfortably inside all three retention windows (shortest is
  # idp_cache_orphan's 7 days) so a missed day or two from
  # concurrencyPolicy: Forbid skipping an overrun doesn't risk the
  # alert rule's own tolerance (retention_window_seconds +
  # sweep_interval_seconds in observability.md's alert expression:
  # sweep_interval_seconds = 86400 for this schedule).
  schedule: "0 3 * * *"
  # Forbid, not the Kubernetes default Allow — per Tobias's (01)
  # objection on refinement/LT-44.md: a slow first-ever sweep (no
  # prior-run history, a possible real backlog across all three
  # classes) could otherwise overlap with its own next scheduled
  # invocation, recreating the exact "two schedulers hit the same
  # tables concurrently" risk already solved once for the migration Job
  # (LT-45) and carried forward here. A skipped-due-to-overlap run is
  # NOT silently invisible: Kubernetes' own CronJob controller emits a
  # Warning event with reason JobAlreadyActive
  # ("Not starting job because prior execution is running and
  # concurrency policy is Forbid"), visible via `kubectl describe
  # cronjob retention-sweep` / `kubectl get events` — verified this is
  # real, documented controller behavior before relying on it, not
  # assumed. startingDeadlineSeconds bounds how long a skipped tick
  # waits to retry before Kubernetes gives up on it entirely, per the
  # documented interaction between Forbid and this field.
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 900
  jobTemplate:
    spec:
      # No backoffLimit override (defaults to 6) and no explicit
      # activeDeadlineSeconds — a stuck sweep should retry like any
      # other Job, not be treated as a fixed-duration batch the way the
      # migration Job's own backoffLimit: 2 was tuned for a
      # fail-fast-on-schema-error case; this story doesn't have that
      # same reasoning to import.
      template:
        metadata: {labels: {app: retention-sweep}}
        spec:
          serviceAccountName: retention-sweep
          securityContext: {runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532}
          restartPolicy: Never
          containers:
            - name: retention-sweep
              # Same image as api-service, different APP_MODE — per
              # refinement/LT-44.md's explicit non-goal ("no new
              # container image"), matching team-lead's "half-day
              # story" framing. PR #55 (03) wires APP_MODE=sweep to run
              # the DeleteExpired loop once per class until Drained,
              # then exit — never http.ListenAndServe.
              image: ghcr.io/wtvamp/loginid-takehome/api-service:IMAGE_TAG
              securityContext: {readOnlyRootFilesystem: true}
              resources:
                requests: {cpu: "100m", memory: "128Mi"}
                limits: {cpu: "500m", memory: "256Mi"}
              env:
                - {name: APP_MODE, value: sweep}
                - {name: DB_DRIVER, value: postgres}
                - {name: DB_DSN_FILE, value: /secrets/db/dsn}
