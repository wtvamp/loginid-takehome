# Deploy manifests for LT-34/LT-45/LT-47's vertical slice, extended in
# LT-32 for the issuer Deployment split (F13's fix) and LT-52 for a real
# Postgres instance, the migration Job, and DB_DSN_FILE wiring into
# api-service. No CockroachDB deployment here — CI-only (LT-47), per
# LT-52's stated scope limit.
#
# No Namespace object here, deliberately: the scoped loginid-takehome-deployer
# ServiceAccount's RBAC (deploy/rbac.yaml) is namespace-scoped to
# loginid-takehome and correctly cannot get/create/patch a cluster-scoped
# Namespace object — that's the isolation working as designed, not a gap.
# The namespace itself is created once, out of band, by whoever runs the
# initial cluster bootstrap (deploy/rbac.yaml also creates
# loginid-takehome-runners for the same reason).
#
# No Secret object here either, and none ever will be for the JWT signing
# key specifically: deploy/rbac.yaml's Role grants nothing on `secrets` at
# all, so an attempt to apply one here would fail Forbidden, the same way
# Namespace did. The signing-key Secret is created out-of-band — see
# deploy/issuer-secret-bootstrap.yaml — per Tobias's (01) accepted
# objection on LT-32's refinement: the CI-applied manifest set must never
# be the thing that can read or write that key.
apiVersion: v1
kind: ServiceAccount
metadata: {name: api-service, namespace: loginid-takehome}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: api-service-issuer, namespace: loginid-takehome}
---
apiVersion: v1
kind: ResourceQuota
metadata: {name: loginid-takehome-quota, namespace: loginid-takehome}
spec:
  # Quota math (LT-52 adds Postgres + a transient migration Job pod;
  # LT-51 adds the issuer database in the same Postgres instance and the
  # migration Job's third invocation — no new pods, no change to the
  # numbers below beyond what LT-52 already established. api-service-
  # issuer's replicas dropped 2 -> 1 per Helena's (02) ruling, which
  # only tightens headroom further, not loosens it):
  #   requests.cpu:    550m existing + postgres 100m + migrate 50m  = 700m  (limit "1" = 1000m, fits)
  #   requests.memory: 704Mi existing + postgres 256Mi + migrate 64Mi = 1024Mi (was AT the 1Gi limit already — bumped to 2Gi for real headroom)
  #   limits.cpu:      2750m existing + postgres 500m + migrate 200m = 3450m (was "3" = 3000m — bumped to "4")
  #   limits.memory:   1408Mi existing + postgres 512Mi + migrate 128Mi = 2048Mi (was AT the 2Gi limit — bumped to 3Gi)
  #   pods: 6 existing + postgres 1 + migrate 1 (transient) = 8, fits under 10
  # Shown here, not discovered as a second FailedCreate, per the standing
  # checklist in containerization-design.md §5a.
  hard:
    requests.cpu: "1"
    requests.memory: 2Gi
    limits.cpu: "4"
    limits.memory: 3Gi
    pods: "10"
---
# api-service's Deployment/Service live in deploy/api-service.yaml, not
# here, and are deliberately applied by the deploy workflow AFTER
# deploy/manifests.yaml (Postgres + the migration Job) and after the
# migration Job completes — LT-52's requirement that the schema exists
# before api-service starts trying to use it. Nothing else in this file
# needs that ordering; api-service is the one thing that does.
#
# api-service-issuer: the ONLY Deployment that mounts the JWT signing key
# (F13's fix, per handoff-04-secrets.md row #2 and
# containerization-design.md's "Why two Deployments of one image, not RBAC
# on one"). Same image as api-service, mode selected by APP_MODE.
#
# replicas: 1, not 2 — per Helena's (02) LT-51 review: GrantLimiter
# (internal/api, wired around the client-credentials grant) tracks
# failed-attempt state in-process, per-pod. Two replicas behind
# round-robin means an attacker's failures split across both, silently
# halving the limiter's effective threshold before it engages — a real
# security regression, not a cosmetic one. This POC issuer has no HA
# requirement that would justify accepting that.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-service-issuer
  namespace: loginid-takehome
spec:
  replicas: 1
  selector: {matchLabels: {app: api-service-issuer}}
  template:
    metadata: {labels: {app: api-service-issuer}}
    spec:
      serviceAccountName: api-service-issuer
      securityContext: {runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532}
      containers:
        - name: api-service
          image: ghcr.io/wtvamp/loginid-takehome/api-service:IMAGE_TAG
          securityContext: {readOnlyRootFilesystem: true}
          resources:
            requests: {cpu: "100m", memory: "128Mi"}
            limits: {cpu: "500m", memory: "256Mi"}
          env:
            - {name: HTTP_ADDR, value: ":8080"}
            - {name: APP_MODE, value: issuer}
            - {name: JWT_SIGNING_KEY_FILE, value: /secrets/jwt/signing-key}
            - {name: ISSUER_DB_DSN_FILE, value: /secrets/issuer-db/dsn}
          volumeMounts:
            - {name: jwt-signing-key, mountPath: /secrets/jwt, readOnly: true}
            - {name: issuer-db-runtime-credential, mountPath: /secrets/issuer-db, readOnly: true}
          readinessProbe: {httpGet: {path: /healthz, port: 8080}, initialDelaySeconds: 5}
          livenessProbe: {httpGet: {path: /healthz, port: 8080}, initialDelaySeconds: 10}
      volumes:
        - name: issuer-db-runtime-credential
          secret: {secretName: issuer-db-runtime-credential}
        - name: jwt-signing-key
          secret: {secretName: api-service-jwt-signing-key}
---
apiVersion: v1
kind: Service
metadata: {name: api-service-issuer, namespace: loginid-takehome}
spec:
  selector: {app: api-service-issuer}
  ports: [{port: 443, targetPort: 8080}]
---
# --- Postgres (LT-52) ---
#
# ConfigMap holding the initdb script that creates the migrator/runtime
# roles the first time Postgres initializes an empty PVC. Safe to be
# CI-applied (no secret material) — the passwords it interpolates come
# from Secret env vars at container start, never written into this
# ConfigMap itself.
#
# CAVEAT — the same class as the sequences/UUID note below, stated up
# front rather than rediscovered: docker-entrypoint-initdb.d scripts run
# ONLY on an empty $PGDATA (Postgres's own first-init behavior, not a
# choice this manifest makes). Once a PVC has been initialized, editing
# these scripts changes nothing on the live instance — a future edit
# here (a new role, a new grant, a new database) has to be hand-applied
# against the running instance too, the same way the issuer
# database/roles below were (see deploy/db-secret-bootstrap.yaml's
# "Hand-apply procedure used for LT-51" section for the exact commands
# that were actually run, and the note there on the better long-term
# shape this should eventually become).
apiVersion: v1
kind: ConfigMap
metadata: {name: postgres-initdb, namespace: loginid-takehome}
data:
  01-create-roles.sh: |
    #!/bin/bash
    set -euo pipefail
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" <<-EOSQL
      CREATE ROLE migrator WITH LOGIN PASSWORD '$MIGRATOR_PASSWORD' CREATEDB;
      GRANT ALL PRIVILEGES ON DATABASE $POSTGRES_DB TO migrator;
      -- Postgres 15+ revoked PUBLIC's implicit CREATE on the public
      -- schema — database-level privileges above don't cover schema-level
      -- ones. Without this, migrator's own CREATE TABLE fails with
      -- "permission denied for schema public" (verified against a live
      -- postgres:16-alpine container by 01/Naomi — this would have broken
      -- the first real deploy).
      GRANT CREATE ON SCHEMA public TO migrator;
      CREATE ROLE runtime WITH LOGIN PASSWORD '$RUNTIME_PASSWORD';
      GRANT CONNECT ON DATABASE $POSTGRES_DB TO runtime;
      -- runtime gets DML on tables migrator creates from now on, without
      -- needing to know table names in advance and without ordering this
      -- after the migration Job runs — Postgres 15+ default privileges no
      -- longer grant CREATE on the public schema to non-owners, so
      -- runtime genuinely cannot run DDL (LT-52's acceptance criterion).
      --
      -- CAVEAT, stated rather than discovered later: this ALTER DEFAULT
      -- PRIVILEGES clause is scoped to ON TABLES only — it grants nothing
      -- on sequences. The current schema is UUID-keyed throughout (per
      -- 05-data-ops/multi-db-strategy.md), so no column depends on a
      -- SERIAL/IDENTITY sequence and this gap is currently inert. If a
      -- future migration ever adds a SERIAL/IDENTITY column, runtime
      -- would silently be unable to insert into that table (no USAGE on
      -- its sequence) until a matching `... ON SEQUENCES ...` grant is
      -- added here — this is the first place to look if that happens.
      ALTER DEFAULT PRIVILEGES FOR ROLE migrator IN SCHEMA public
        GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO runtime;
    EOSQL
  02-create-issuer-db.sh: |
    #!/bin/bash
    set -euo pipefail
    # LT-51: the token issuer's client store is a separate `issuer`
    # database in this same Postgres instance (Priya's ruling — a
    # distinct database, not just a distinct schema, makes a
    # cross-database join to user_profile/user_credential structurally
    # impossible, not merely policy-forbidden). Same migrator/runtime
    # role-split discipline as the main database, carried over rather
    # than rediscovered — including the CREATE ON SCHEMA public grant
    # that LT-52 already had to learn the hard way.
    #
    # CREATE DATABASE must be the ONLY statement in its query — verified
    # empirically against a real container: psql sends a multi-statement
    # -c/heredoc string as one simple-query protocol message, which
    # Postgres wraps in an implicit transaction block, and CREATE DATABASE
    # cannot run inside any transaction block, explicit or implicit
    # ("CREATE DATABASE cannot run inside a transaction block") — even
    # when it's the first of several statements targeting a database
    # other than itself. Its own invocation, alone, then a separate one
    # for the roles (roles are cluster-wide, not per-database), then a
    # third reconnecting to `issuer` for the database-and-schema-scoped
    # grants.
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" -c "CREATE DATABASE issuer;"
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" <<-EOSQL
      CREATE ROLE issuer_migrator WITH LOGIN PASSWORD '$ISSUER_MIGRATOR_PASSWORD' CREATEDB;
      CREATE ROLE issuer_runtime WITH LOGIN PASSWORD '$ISSUER_RUNTIME_PASSWORD';
    EOSQL
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname issuer <<-EOSQL
      GRANT ALL PRIVILEGES ON DATABASE issuer TO issuer_migrator;
      GRANT CREATE ON SCHEMA public TO issuer_migrator;
      GRANT CONNECT ON DATABASE issuer TO issuer_runtime;
      ALTER DEFAULT PRIVILEGES FOR ROLE issuer_migrator IN SCHEMA public
        GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO issuer_runtime;
    EOSQL
---
# Self-signed Issuer + Certificate for Postgres's server TLS, per
# Marcus's (02) ruling on threat-model.md Assumption 9: PII crosses this
# connection, and this track already requires TLS for the same PII one
# hop earlier (client-facing), so plaintext one hop later on a shared
# cluster with unverified network isolation would be inconsistent.
# letsencrypt-prod (used by the public Ingress) can't issue for an
# internal-only DNS name — self-signed is sufficient here because the
# client uses sslmode=require, not verify-full (NetworkPolicy already
# restricts *who* can reach the DB Service; TLS covers *what's on the
# wire*, not identity verification, per Marcus's own scoping of what this
# hop needs).
apiVersion: cert-manager.io/v1
kind: Issuer
metadata: {name: postgres-selfsigned, namespace: loginid-takehome}
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata: {name: postgres-server-tls, namespace: loginid-takehome}
spec:
  secretName: postgres-server-tls
  issuerRef: {name: postgres-selfsigned, kind: Issuer}
  dnsNames:
    - postgres.loginid-takehome.svc.cluster.local
    - postgres.loginid-takehome.svc
    - postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: postgres, namespace: loginid-takehome}
spec:
  serviceName: postgres
  replicas: 1
  selector: {matchLabels: {app: postgres}}
  template:
    metadata: {labels: {app: postgres}}
    spec:
      # postgres:16-alpine's image defaults to root (its entrypoint drops
      # to the postgres user internally via gosu when started as root) —
      # runAsNonRoot alone fails with "container has runAsNonRoot and
      # image will run as root" without an explicit numeric runAsUser, the
      # same class of bug as LT-45's distroless fix. Verified the actual
      # UID/GID directly (`docker run --entrypoint getent ... passwd
      # postgres` -> uid 70, not the commonly-assumed 999) rather than
      # guessing — confirmed the entrypoint runs correctly when started
      # already as UID 70 (skips its own root-detection branch).
      securityContext: {runAsNonRoot: true, runAsUser: 70, runAsGroup: 70, fsGroup: 70}
      containers:
        - name: postgres
          image: postgres:16-alpine
          # ssl_key_file must not be group/world-readable or postgres
          # refuses to start; cert-manager's Secret mounts default to
          # 0644, so defaultMode below + fsGroup above are what make this
          # actually work, not just "a cert exists".
          args:
            - -c
            - ssl=on
            - -c
            - ssl_cert_file=/certs/tls.crt
            - -c
            - ssl_key_file=/certs/tls.key
          resources:
            requests: {cpu: "100m", memory: "256Mi"}
            limits: {cpu: "500m", memory: "512Mi"}
          env:
            - {name: POSTGRES_USER, value: postgres}
            - {name: POSTGRES_DB, value: loginid}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: postgres-superuser, key: password}}
            - name: MIGRATOR_PASSWORD
              valueFrom: {secretKeyRef: {name: db-migrator-credential, key: password}}
            - name: RUNTIME_PASSWORD
              valueFrom: {secretKeyRef: {name: db-runtime-credential, key: password}}
            - name: ISSUER_MIGRATOR_PASSWORD
              valueFrom: {secretKeyRef: {name: issuer-db-migrator-credential, key: password}}
            - name: ISSUER_RUNTIME_PASSWORD
              valueFrom: {secretKeyRef: {name: issuer-db-runtime-credential, key: password}}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          ports: [{containerPort: 5432}]
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: initdb, mountPath: /docker-entrypoint-initdb.d, readOnly: true}
            - {name: server-tls, mountPath: /certs, readOnly: true}
          readinessProbe: {exec: {command: [pg_isready, -U, postgres]}, initialDelaySeconds: 5, periodSeconds: 5}
          livenessProbe: {exec: {command: [pg_isready, -U, postgres]}, initialDelaySeconds: 10, periodSeconds: 10}
      volumes:
        - name: initdb
          configMap: {name: postgres-initdb, defaultMode: 0555}
        - name: server-tls
          secret: {secretName: postgres-server-tls, defaultMode: 0600}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: 2Gi}}
---
apiVersion: v1
kind: Service
metadata: {name: postgres, namespace: loginid-takehome}
spec:
  clusterIP: None # headless — StatefulSet stable network identity
  selector: {app: postgres}
  ports: [{port: 5432, targetPort: 5432}]
---
# Postgres holds real PII at rest — the first component in this namespace
# that does. Reachable only from api-service and the migration Job's own
# pod (labeled app: db-migrate), matching idp-connector-default-deny's
# shape. Nothing else in the namespace, and nothing outside it, can reach
# port 5432 on this pod.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: postgres-default-deny, namespace: loginid-takehome}
spec:
  podSelector: {matchLabels: {app: postgres}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - {podSelector: {matchLabels: {app: api-service}}}
        - {podSelector: {matchLabels: {app: api-service-issuer}}}
        - {podSelector: {matchLabels: {app: db-migrate}}}
---
# Migration Job: three goose invocations, each against its own version
# table. Main-database pair first — backend directory then shared/
# (Priya's corrected order: shared/ holds only the auth_method seed row,
# which depends on auth_method existing, which the backend DDL creates)
# — then the issuer database LAST (LT-51), since it has no ordering
# dependency on the main database's migrations at all; running it last
# is simplest, not required by any dependency. All three must succeed or
# the Job fails; idempotent by construction (goose skips already-applied
# versions). Runs to completion before api-service's rollout — sequenced
# by the deploy workflow (kubectl wait for this Job's completion before
# applying api-service's Deployment), not by an assumption about
# scheduling order.
apiVersion: batch/v1
kind: Job
metadata: {name: db-migrate, namespace: loginid-takehome}
spec:
  backoffLimit: 2
  template:
    metadata: {labels: {app: db-migrate}}
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: ghcr.io/wtvamp/loginid-takehome/migrate:IMAGE_TAG
          resources:
            requests: {cpu: "50m", memory: "64Mi"}
            limits: {cpu: "200m", memory: "128Mi"}
          env:
            # GOOSE_DBSTRING, not an argv/positional argument: goose's own
            # env-var support means the DSN (which contains a password)
            # never appears in `ps` output inside this pod's PID
            # namespace — per review, api-service already does the
            # stronger file-based equivalent (DB_DSN_FILE) and this
            # should match that discipline, not fall back to argv.
            - name: GOOSE_DRIVER
              value: postgres
            - name: GOOSE_DBSTRING
              valueFrom: {secretKeyRef: {name: db-migrator-credential, key: dsn}}
            - name: ISSUER_GOOSE_DBSTRING
              valueFrom: {secretKeyRef: {name: issuer-db-migrator-credential, key: dsn}}
          command:
            - sh
            - -c
            - |
              set -e
              GOOSE_MIGRATION_DIR=/migrations/postgres goose -table goose_db_version_postgres up
              GOOSE_MIGRATION_DIR=/migrations/shared goose -table goose_db_version_shared up
              GOOSE_DBSTRING="$ISSUER_GOOSE_DBSTRING" GOOSE_MIGRATION_DIR=/migrations/issuer goose -table goose_db_version_issuer up
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: idp-connector
  namespace: loginid-takehome
spec:
  replicas: 1
  selector: {matchLabels: {app: idp-connector}}
  template:
    metadata: {labels: {app: idp-connector}}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532}
      containers:
        - name: idp-connector
          image: ghcr.io/wtvamp/loginid-takehome/idp-connector:IMAGE_TAG
          securityContext: {readOnlyRootFilesystem: true}
          resources:
            requests: {cpu: "50m", memory: "64Mi"}
            limits: {cpu: "250m", memory: "128Mi"}
          env:
            - {name: HTTP_ADDR, value: ":8081"}
          readinessProbe: {httpGet: {path: /healthz, port: 8081}, initialDelaySeconds: 5}
          livenessProbe: {httpGet: {path: /healthz, port: 8081}, initialDelaySeconds: 10}
---
apiVersion: v1
kind: Service
metadata: {name: idp-connector, namespace: loginid-takehome}
spec:
  selector: {app: idp-connector}
  ports: [{port: 443, targetPort: 8081}]
---
# idp-connector accepts ingress only from api-service — no inbound Service
# on the public Ingress reaches it, and the namespace default is allow, not
# deny, on this shared cluster, per decisions/deploy-path.md.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: idp-connector-default-deny, namespace: loginid-takehome}
spec:
  podSelector: {matchLabels: {app: idp-connector}}
  policyTypes: [Ingress]
  ingress:
    - from: [{podSelector: {matchLabels: {app: api-service}}}]
---
# api-service-issuer serves: (a) JWKS, in-cluster only, no Ingress route
# for it — internal callers reach it via the ClusterIP Service directly;
# (b) the reserved /auth/token path, which the Ingress below DOES route
# publicly. Without this policy the pod would be reachable from anything
# in the namespace (default is allow, not deny). Two allowed sources:
# api-service/idp-connector (JWKS), and the ingress-nginx-controller
# namespace (so the public /auth/token route in the Ingress below still
# works — that traffic arrives from ingress-nginx's pod, not api-service's).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: api-service-issuer-default-deny, namespace: loginid-takehome}
spec:
  podSelector: {matchLabels: {app: api-service-issuer}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - {podSelector: {matchLabels: {app: api-service}}}
        - {podSelector: {matchLabels: {app: idp-connector}}}
        - {namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: ingress-nginx}}}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: loginid-takehome
  namespace: loginid-takehome
  annotations: {cert-manager.io/cluster-issuer: letsencrypt-prod}
spec:
  ingressClassName: nginx
  tls:
    - hosts: [loginid-takehome.uplifttech.org]
      secretName: loginid-takehome-tls
  rules:
    - host: loginid-takehome.uplifttech.org
      http:
        paths:
          - {path: /healthz, pathType: Exact, backend: {service: {name: api-service, port: {number: 443}}}}
          - {path: /auth/token, pathType: Exact, backend: {service: {name: api-service-issuer, port: {number: 443}}}}
          # POST /profiles/search, GET /profiles/{id} (internal/app/verifier_router.go)
          # — LT-39's protected routes were wired into the binary at
          # b857b40 but never added here, so they 404'd from
          # ingress-nginx's default backend, not from the app's own auth
          # middleware. JWKS (/.well-known/jwks.json) deliberately has NO
          # rule here — in-cluster only, per handoff-03-auth v6.
          - {path: /profiles, pathType: Prefix, backend: {service: {name: api-service, port: {number: 443}}}}
