# Walking-skeleton deploy manifests for LT-34/LT-45/LT-47's vertical slice.
#
# Deliberately narrower than 04-infra-devops/containerization-design.md's
# full design: no api-service-issuer Deployment, no JWT signing key mount,
# no migration Job, no DB_DSN secret. Those all wire up real Secrets for
# config the current code (internal/app, internal/config) doesn't use yet
# — config.Load() never errors on an unset DB_DSN/DB_DSN_FILE, and
# NewRouter only serves /healthz. Applying the full manifest set today
# would mean mounting Secrets nothing reads, or inventing placeholder
# Secrets that represent nothing real — worse than deploying what the code
# actually needs. This file grows to match the full design (issuer
# Deployment, migration Job, DB/JWT secrets) exactly when 03 lands the
# DAO/JWT wiring those need, per 04-infra-devops/decisions/deploy-path.md.
apiVersion: v1
kind: Namespace
metadata: {name: loginid-takehome}
---
apiVersion: v1
kind: ResourceQuota
metadata: {name: loginid-takehome-quota, namespace: loginid-takehome}
spec:
  hard:
    requests.cpu: "1"
    requests.memory: 1Gi
    limits.cpu: "2"
    limits.memory: 2Gi
    pods: "10"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-service
  namespace: loginid-takehome
spec:
  replicas: 2
  selector: {matchLabels: {app: api-service}}
  template:
    metadata: {labels: {app: api-service}}
    spec:
      securityContext: {runAsNonRoot: true}
      containers:
        - name: api-service
          image: ghcr.io/wtvamp/loginid-takehome/api-service:IMAGE_TAG
          securityContext: {readOnlyRootFilesystem: true}
          resources:
            requests: {cpu: "100m", memory: "128Mi"}
            limits: {cpu: "500m", memory: "256Mi"}
          env:
            - {name: HTTP_ADDR, value: ":8080"}
          readinessProbe: {httpGet: {path: /healthz, port: 8080}, initialDelaySeconds: 5}
          livenessProbe: {httpGet: {path: /healthz, port: 8080}, initialDelaySeconds: 10}
---
apiVersion: v1
kind: Service
metadata: {name: api-service, namespace: loginid-takehome}
spec:
  selector: {app: api-service}
  ports: [{port: 443, targetPort: 8080}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: idp-connector
  namespace: loginid-takehome
spec:
  replicas: 1
  selector: {matchLabels: {app: idp-connector}}
  template:
    metadata: {labels: {app: idp-connector}}
    spec:
      securityContext: {runAsNonRoot: true}
      containers:
        - name: idp-connector
          image: ghcr.io/wtvamp/loginid-takehome/idp-connector:IMAGE_TAG
          securityContext: {readOnlyRootFilesystem: true}
          resources:
            requests: {cpu: "50m", memory: "64Mi"}
            limits: {cpu: "250m", memory: "128Mi"}
          env:
            - {name: HTTP_ADDR, value: ":8081"}
          readinessProbe: {httpGet: {path: /healthz, port: 8081}, initialDelaySeconds: 5}
          livenessProbe: {httpGet: {path: /healthz, port: 8081}, initialDelaySeconds: 10}
---
apiVersion: v1
kind: Service
metadata: {name: idp-connector, namespace: loginid-takehome}
spec:
  selector: {app: idp-connector}
  ports: [{port: 443, targetPort: 8081}]
---
# idp-connector accepts ingress only from api-service — no inbound Service
# on the public Ingress reaches it, and the namespace default is allow, not
# deny, on this shared cluster, per decisions/deploy-path.md.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: idp-connector-default-deny, namespace: loginid-takehome}
spec:
  podSelector: {matchLabels: {app: idp-connector}}
  policyTypes: [Ingress]
  ingress:
    - from: [{podSelector: {matchLabels: {app: api-service}}}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: loginid-takehome
  namespace: loginid-takehome
  annotations: {cert-manager.io/cluster-issuer: letsencrypt-prod}
spec:
  ingressClassName: nginx
  tls:
    - hosts: [loginid-takehome.uplifttech.org]
      secretName: loginid-takehome-tls
  rules:
    - host: loginid-takehome.uplifttech.org
      http:
        paths:
          - {path: /healthz, pathType: Exact, backend: {service: {name: api-service, port: {number: 443}}}}
