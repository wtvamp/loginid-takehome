# Out-of-band bootstrap for the JWT signing key (LT-32, F13's fix, per
# Tobias's (01) accepted objection). NEVER applied by CI — deploy/rbac.yaml
# grants loginid-takehome-deployer nothing on `secrets`, so an attempt to
# manage this Secret through the CI-applied manifest set would fail
# Forbidden by construction. Apply by hand, once, before the first
# api-service-issuer rollout:
#
#   openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out /tmp/signing-key.pem
#   kubectl create secret generic api-service-jwt-signing-key \
#     --from-file=signing-key=/tmp/signing-key.pem \
#     -n loginid-takehome
#   shred -u /tmp/signing-key.pem   # or equivalent secure delete
#
# The key itself is real key material (per api-auth-design.md's RS256/ES256
# requirement, once 02/03 finalize the algorithm) — generating a real key
# is 02/03's call; the openssl line above is a placeholder shape, not a
# recommendation to use it verbatim without confirming the algorithm.
#
# No RBAC object accompanies this file: api-service-issuer's own
# ServiceAccount doesn't need a Role granting it `get` on this Secret,
# because deploy/manifests.yaml's Deployment mounts it as a volume — that
# path is authorized by the kubelet against the node, not by the pod's own
# ServiceAccount token against the API server. A Role here would grant
# nothing the volume mount actually uses; it would only matter if the
# issuer's own code ever called the Kubernetes API directly to read the
# Secret, which it doesn't (it reads the mounted file).
