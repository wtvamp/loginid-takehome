# Out-of-band bootstrap for Postgres's credentials (LT-52), same
# discipline as deploy/issuer-secret-bootstrap.yaml: NEVER applied by CI —
# deploy/rbac.yaml grants loginid-takehome-deployer nothing on `secrets`
# at all, so an attempt to manage any of these through the CI-applied
# manifest set would fail Forbidden by construction.
#
# Three Secrets, generated together in one sitting since all three
# passwords need to be known at once to build the `dsn` values below.
# Apply by hand, once, before the first Postgres rollout:
#
# Passwords use `-hex`, not `-base64`: base64's standard alphabet
# includes `/` (and `+`), and an unescaped `/` in a password embedded
# directly in a `postgres://user:pass@host/db` URL breaks the DSN parser
# — confirmed against the real deploy (goose: "invalid port ... after
# host", from a generated password that happened to contain `/`). Hex
# has no URL-meaningful characters at all, so this can't recur.
#
#   SUPERUSER_PW=$(openssl rand -hex 24)
#   MIGRATOR_PW=$(openssl rand -hex 24)
#   RUNTIME_PW=$(openssl rand -hex 24)
#
# General rule this generalizes to: nothing in this pipeline (this
# bootstrap, the migration Job, goose itself) URL-encodes any DSN
# component — every piece that ends up embedded in a `postgres://...`
# string must be URL-safe by construction, not by escaping after the
# fact. Hex passwords satisfy that; a future credential generated any
# other way needs the same property checked before use, not assumed.
#
#   kubectl create secret generic postgres-superuser \
#     --from-literal=password="$SUPERUSER_PW" -n loginid-takehome
#
#   kubectl create secret generic db-migrator-credential \
#     --from-literal=password="$MIGRATOR_PW" \
#     --from-literal=dsn="postgres://migrator:$MIGRATOR_PW@postgres.loginid-takehome.svc:5432/loginid?sslmode=require" \
#     -n loginid-takehome
#
#   kubectl create secret generic db-runtime-credential \
#     --from-literal=password="$RUNTIME_PW" \
#     --from-literal=dsn="postgres://runtime:$RUNTIME_PW@postgres.loginid-takehome.svc:5432/loginid?sslmode=require" \
#     -n loginid-takehome
#
#   unset SUPERUSER_PW MIGRATOR_PW RUNTIME_PW
#
# Why three Secrets, not one: `postgres-superuser` is consumed only by
# the Postgres StatefulSet itself (POSTGRES_PASSWORD) and the initdb
# script's own auth — it never leaves that pod. `db-migrator-credential`
# and `db-runtime-credential` each carry two keys: `password` (read by
# the initdb ConfigMap's CREATE ROLE statements, via secretKeyRef env
# vars — see deploy/manifests.yaml's StatefulSet) and `dsn` (a
# ready-to-use connection string, consumed directly by the migration Job
# and mounted into api-service as DB_DSN_FILE respectively). The
# migrator/runtime split, and the fact that runtime's Postgres role gets
# no DDL rights (Postgres 15+ default privileges, per the initdb
# script), is what R4 in 05-data-ops/migration-approach.md and LT-46's
# criterion both require.
#
# Rotation: regenerate a password, `kubectl create secret ... --dry-run
# -o yaml | kubectl apply -f -` to update the Secret, `ALTER ROLE
# <role> WITH PASSWORD '<new>'` against the running Postgres instance
# (via psql, using the superuser credential), then roll the Deployment/
# Job that reads the rotated credential so it picks up the new mount.
#
# --- LT-51 addition: the issuer database's own migrator/runtime pair ---
#
# Same discipline, same hex rule, generated alongside the three above:
#
#   ISSUER_MIGRATOR_PW=$(openssl rand -hex 24)
#   ISSUER_RUNTIME_PW=$(openssl rand -hex 24)
#
#   kubectl create secret generic issuer-db-migrator-credential \
#     --from-literal=password="$ISSUER_MIGRATOR_PW" \
#     --from-literal=dsn="postgres://issuer_migrator:$ISSUER_MIGRATOR_PW@postgres.loginid-takehome.svc:5432/issuer?sslmode=require" \
#     -n loginid-takehome
#
#   kubectl create secret generic issuer-db-runtime-credential \
#     --from-literal=password="$ISSUER_RUNTIME_PW" \
#     --from-literal=dsn="postgres://issuer_runtime:$ISSUER_RUNTIME_PW@postgres.loginid-takehome.svc:5432/issuer?sslmode=require" \
#     -n loginid-takehome
#
#   unset ISSUER_MIGRATOR_PW ISSUER_RUNTIME_PW
#
# Same reasoning as the main pair: `issuer-db-migrator-credential`'s
# `password` key is read by the initdb ConfigMap's CREATE ROLE statement
# for `issuer_migrator`/`issuer_runtime`; its `dsn` key (note: dbname is
# `issuer`, not `loginid`) is read by the migration Job's third goose
# invocation. `issuer-db-runtime-credential`'s `dsn` is mounted into
# api-service-issuer as ISSUER_DB_DSN_FILE. The issuer database is a
# separate database in the same Postgres instance (Priya's ruling — see
# deploy/manifests.yaml's 02-create-issuer-db.sh), not a separate server,
# so `postgres-superuser` is unchanged and not duplicated here.
#
# --- Hand-apply procedure actually used for LT-51 ---
#
# deploy/manifests.yaml's 02-create-issuer-db.sh ONLY runs on an empty
# $PGDATA (Postgres's own initdb behavior). By the time LT-51 landed,
# this cluster's Postgres PVC already held real demo data (LT-39's
# review rows) that wasn't to be wiped just to pick up a new initdb
# script — so the issuer database and its roles were created by hand,
# directly against the already-running instance, with the exact
# commands the script would have run:
#
#   kubectl -n loginid-takehome exec postgres-0 -- \
#     psql -U postgres -d loginid -c "CREATE DATABASE issuer;"
#
#   kubectl -n loginid-takehome exec -i postgres-0 -- psql -U postgres -d loginid <<EOSQL
#   CREATE ROLE issuer_migrator WITH LOGIN PASSWORD '$ISSUER_MIGRATOR_PW' CREATEDB;
#   CREATE ROLE issuer_runtime WITH LOGIN PASSWORD '$ISSUER_RUNTIME_PW';
#   EOSQL
#
#   kubectl -n loginid-takehome exec -i postgres-0 -- psql -U postgres -d issuer <<'EOSQL'
#   GRANT ALL PRIVILEGES ON DATABASE issuer TO issuer_migrator;
#   GRANT CREATE ON SCHEMA public TO issuer_migrator;
#   GRANT CONNECT ON DATABASE issuer TO issuer_runtime;
#   ALTER DEFAULT PRIVILEGES FOR ROLE issuer_migrator IN SCHEMA public
#     GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO issuer_runtime;
#   EOSQL
#
# Verified afterward against the live instance (not assumed from
# reading the script): `\du`, `\l`, `\dn+`, and
# `SELECT has_schema_privilege('issuer_migrator', 'public', 'CREATE')`
# (true) / same for `issuer_runtime` (false) — pasted into PR #36 rather
# than taken on faith, since the main database's equivalent grant was
# missing for two real days before anyone checked it live.
#
# Known-correct long-term shape, not built now: this hand-apply step is
# exactly the kind of thing that drifts from the manifest silently (the
# ConfigMap says one thing, the live instance says whatever was last
# hand-run). The fix, written down so it isn't rediscovered next time a
# role/grant changes: an idempotent provisioning Job that runs on every
# deploy (not just first-init) and converges live state to the desired
# state — e.g. `DO $$ BEGIN CREATE ROLE ...; EXCEPTION WHEN
# duplicate_object THEN NULL; END $$;` for each role, plus GRANT/ALTER
# DEFAULT PRIVILEGES statements re-run unconditionally (Postgres GRANTs
# are themselves idempotent — re-granting an already-held privilege is a
# no-op, not an error, unlike CREATE ROLE). Not built for this take-home
# because the manual step above worked and re-init-only initdb was
# already the established pattern from LT-52; worth doing before this
# pattern is repeated a third time.
