# RBAC for the scoped runner set (deploy/runner-set-values.yaml). The
# ServiceAccount lives in loginid-takehome-runners (where the runner Pods
# run — a ServiceAccount must share a namespace with the Pod that uses it)
# but its Role grant is scoped to loginid-takehome (the app namespace) via
# a cross-namespace RoleBinding subject. No ClusterRole, no cluster-scoped
# verbs — this identity can act on nothing outside loginid-takehome.
apiVersion: v1
kind: Namespace
metadata: {name: loginid-takehome-runners}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: loginid-takehome-deployer, namespace: loginid-takehome-runners}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: loginid-takehome-deployer, namespace: loginid-takehome}
rules:
  - apiGroups: ["apps"]
    resources: [deployments, statefulsets]
    verbs: [get, list, watch, create, update, patch]
  - apiGroups: [""]
    resources: [services, resourcequotas, serviceaccounts, configmaps]
    verbs: [get, list, watch, create, update, patch]
  - apiGroups: [""]
    # Read-only, namespace-scoped, no write verbs — lets the deploy
    # workflow surface a failed Job's own log in its own run instead of
    # hitting "pods is forbidden" when it tries to diagnose itself.
    resources: [pods]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: ["networking.k8s.io"]
    resources: [networkpolicies, ingresses]
    verbs: [get, list, watch, create, update, patch]
  - apiGroups: ["cert-manager.io"]
    resources: [issuers, certificates]
    # Not secrets: the Certificate resource here only requests that
    # cert-manager mint one; the resulting TLS Secret is managed by
    # cert-manager's own controller, not read/written by this identity.
    verbs: [get, list, watch, create, update, patch]
  - apiGroups: ["monitoring.coreos.com"]
    # LT-49: PrometheusRule/ServiceMonitor, per Amber's observability
    # inventory. Namespaced objects in loginid-takehome only — the
    # Prometheus CR in ns monitoring (empty ruleNamespaceSelector/
    # serviceMonitorNamespaceSelector) adopts them by label, no edit to
    # that CR or anything in ns monitoring needed.
    resources: [prometheusrules, servicemonitors]
    verbs: [get, list, watch, create, update, patch]
  - apiGroups: ["batch"]
    resources: [jobs]
    # `delete` is needed because a Job's pod template is immutable — the
    # deploy workflow deletes the previous db-migrate Job before
    # re-applying one with a new image tag on every deploy (LT-52).
    verbs: [get, list, watch, create, delete]
  - apiGroups: ["batch"]
    # LT-44's retention-sweep CronJob. update/patch (not delete) since a
    # CronJob's own template isn't immutable the way a bare Job's is —
    # `kubectl apply` can update it in place on every deploy, no
    # delete-then-recreate dance needed.
    resources: [cronjobs]
    verbs: [get, list, watch, create, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: loginid-takehome-deployer, namespace: loginid-takehome}
subjects:
  - kind: ServiceAccount
    name: loginid-takehome-deployer
    namespace: loginid-takehome-runners
roleRef: {kind: Role, name: loginid-takehome-deployer, apiGroup: rbac.authorization.k8s.io}
