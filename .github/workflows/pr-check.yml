name: PR check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-lint-test:
    name: Build, lint, test
    runs-on: ubuntu-latest
    # Postgres runs as a real services: container, health-checked before
    # any step starts. CockroachDB has no way to express its required
    # container command (`start-single-node --insecure`) in the
    # services: syntax — that key only takes image/env/ports/options,
    # no command override — so it's started as a plain `docker run`
    # step below instead, polled for readiness before go test runs, and
    # torn down after. Both DSNs are set at job level so every step
    # (including go test) sees them without repeating the values.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_POSTGRES_DSN: postgres://test:test@localhost:5432/test?sslmode=disable
      TEST_COCKROACHDB_DSN: postgres://root@localhost:26257/defaultdb?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: latest
          install-mode: goinstall # compiles against the job's Go 1.27 toolchain instead of a prebuilt (go1.24) release

      - name: Start CockroachDB (single-node, insecure)
        run: |
          docker run -d --name crdb -p 26257:26257 -p 8080:8080 \
            cockroachdb/cockroach:v23.2.0 start-single-node --insecure
          for i in $(seq 1 30); do
            if curl -fs "http://localhost:8080/health?ready=1" >/dev/null 2>&1; then
              echo "CockroachDB ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "CockroachDB never became ready" >&2
          docker logs crdb
          exit 1

      - name: Test (race)
        run: go test ./... -race -v

      - name: Stop CockroachDB
        if: always()
        run: docker rm -f crdb || true

  security-scan:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks needs full history available locally to diff against origin/<base_ref> below

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Install gitleaks
        # Pinned to the same version .github/workflows/gitleaks-full-history.yml
        # uses, so a PR and the scheduled full-history scan never disagree
        # about what counts as a finding. Verified locally before pinning:
        # 8.21.2 does not flag internal/api/tokenhandler.go's
        # "RecordFailure/RecordSuccess" doc-comment fragment as a
        # generic-api-key match; a newer local install (8.30.1) does —
        # confirming this version is what's kept CI green so far, not an
        # allowlist that happens to exist somewhere.
        run: |
          GITLEAKS_VERSION=8.21.2
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks

      - name: gitleaks (this PR's own commits only)
        # Scoped with --log-opts to origin/<base_ref>..HEAD (backlog Story
        # 9): a full-history scan here meant a leaked-pattern match in ANY
        # commit already on main would fail every subsequent PR forever,
        # not just the PR that introduced it. The full-history safety net
        # moves to gitleaks-full-history.yml (scheduled + on push to
        # main), which still scans everything — this job just stops being
        # a per-PR gate that history it didn't introduce can break.
        run: |
          git fetch origin "${{ github.base_ref }}" --no-tags
          gitleaks detect --source . --no-banner \
            --log-opts="origin/${{ github.base_ref }}..HEAD"

  no-vault-migrated-secrets:
    name: Guard against a reintroduced Kubernetes Secret for a Vault-migrated credential
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check deploy/manifests.yaml and deploy/api-service.yaml
        # LT-46: six application secrets (postgres-superuser included, per
        # the PM's 2026-09-13 ruling) now live in Vault, not Kubernetes
        # Secrets — this fails a future PR that reintroduces a
        # secretName/secretKeyRef for any of them (e.g. a revert, or a
        # copy-pasted example from an older manifest).
        run: python3 deploy/checks/assert-no-migrated-secrets.py

  postgres-netpol-covers-db-consumers:
    name: Guard against a DB-credential-holding workload missing from postgres's NetworkPolicy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check deploy/manifests.yaml and deploy/api-service.yaml
        # Naomi's (01) live LT-44 review: retention-sweep held a real
        # Vault-delivered db-runtime-credential but wasn't in
        # postgres-default-deny's ingress allow-list — a TCP socket
        # stuck in SYN_SENT forever, no error from Vault or the app,
        # nothing in pg_stat_activity. Fails CI if a future workload
        # gets a DB_DSN_FILE/ISSUER_DB_DSN_FILE env var or a Vault
        # DB-credential path without also being added to that
        # allow-list — verified this check actually catches the exact
        # bug that just happened (removed retention-sweep from the
        # allow-list locally, confirmed it fails, then restored it).
        run: python3 deploy/checks/assert-postgres-netpol-covers-db-consumers.py

  never-log-lint:
    name: Guard against a never-log-list value reaching a log call
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check internal/ and cmd/ for never-log-list violations
        # LT-49 (observability.md's "Enforcement beyond 'write it
        # carefully'"): a whole-struct dump verb (%+v/%#v) on a Go log
        # call, an *http.Request/request body passed straight through,
        # or a bare identifier matching a never-log-list field name
        # (password, token, secret, dsn, client_secret) as a log-call
        # argument. Not foolproof by design (a determined developer can
        # rename around it, per observability.md) — catches the
        # accidental case. Verified against real code before wiring in:
        # clean against the actual codebase, and a scratch mutation
        # (a %+v struct dump plus a raw password argument) was
        # confirmed to actually fail this check before being reverted.
        run: python3 scripts/check-never-log.py

  manifest-secret-guard:
    name: Guard against the JWT signing-key Secret leaking into another manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check deploy/manifests.yaml
        run: |
          # There is no admission controller (no Gatekeeper/Kyverno/OPA,
          # no Pod Security label) on the target cluster restricting which
          # Secret a Deployment spec can reference, per 01's LT-32 review —
          # the physical-absence guarantee for api-service's pod spec (it
          # must never mount api-service-jwt-signing-key) is otherwise
          # enforced only by code review. This is the CI-side backstop:
          # fail the build if that Secret name appears in any manifest
          # document other than the api-service-issuer Deployment's own.
          python3 - <<'PYEOF'
          import sys
          docs = open("deploy/manifests.yaml").read().split("\n---\n")
          fail = False
          for doc in docs:
              if "api-service-jwt-signing-key" in doc and "name: api-service-issuer" not in doc:
                  print("::error file=deploy/manifests.yaml::A manifest document references api-service-jwt-signing-key outside the api-service-issuer Deployment:")
                  print(doc)
                  fail = True
          sys.exit(1 if fail else 0)
          PYEOF

  changes:
    name: Detect whether image-buildable code changed
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # Inverse of deploy.yml's paths-ignore: a docs-only PR (LOG.md,
          # PLAN.md, track directories, decisions/**) shouldn't spin up
          # Docker builds that can't have changed. build-lint-test,
          # security-scan, and manifest-secret-guard above are NOT gated
          # by this — they stay on every PR regardless of what changed.
          filters: |
            code:
              - 'cmd/**'
              - 'internal/**'
              - 'migrations/**'
              - 'deploy/**'
              - 'go.mod'
              - 'go.sum'
              - '**/Dockerfile'
              - '.github/workflows/**'

  build-images:
    name: Build images (no push)
    runs-on: ubuntu-latest
    needs: [build-lint-test, changes]
    if: needs.changes.outputs.code == 'true'
    strategy:
      matrix:
        service: [api-service, idp-connector]
    steps:
      - uses: actions/checkout@v4

      - name: Build ${{ matrix.service }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: cmd/${{ matrix.service }}/Dockerfile
          push: false
          tags: loginid-takehome/${{ matrix.service }}:pr-${{ github.event.pull_request.number }}
