name: Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LOG.md"
      - "PLAN.md"
      - "PLANNING.md"
      - "CASTING.md"
      - "decisions/**"
      - "0[1-5]-*/**"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ghcr.io/${{ github.repository }}

jobs:
  build-and-push:
    name: Build and push images
    runs-on: ubuntu-latest
    # Safe to cancel a stale build/push in favor of a newer commit's — an
    # in-progress image build has no external effect worth preserving.
    # Group MUST include matrix.service: without it, every matrix leg
    # (api-service, idp-connector) shares one concurrency slot and starts
    # cancelling EACH OTHER, not just older runs — this is what actually
    # happened in runs 34736676470/34736893015 (api-service kept losing to
    # "a higher priority waiting request" that was its own sibling leg, on
    # every single run, so main HEAD never fully built).
    concurrency:
      group: deploy-build-${{ github.ref }}-${{ matrix.service }}
      cancel-in-progress: true
    strategy:
      matrix:
        service: [api-service, idp-connector, migrate]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # migrate's Dockerfile lives at deploy/migrate/Dockerfile (not
      # cmd/<service>/Dockerfile like the two application images) since
      # it isn't one of them — see deploy/migrate/Dockerfile.
      - name: Resolve Dockerfile path for ${{ matrix.service }}
        id: dockerfile
        run: |
          if [ "${{ matrix.service }}" = "migrate" ]; then
            echo "path=deploy/migrate/Dockerfile" >> "$GITHUB_OUTPUT"
          else
            echo "path=cmd/${{ matrix.service }}/Dockerfile" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ steps.dockerfile.outputs.path }}
          push: true
          build-args: |
            COMMIT_SHA=${{ github.sha }}
          tags: |
            ${{ env.IMAGE_BASE }}/${{ matrix.service }}:${{ github.sha }}
            ${{ env.IMAGE_BASE }}/${{ matrix.service }}:latest

  deploy:
    name: Apply manifests to the lab cluster
    runs-on: loginid-takehome
    needs: [build-and-push]
    # Deliberately NOT cancel-in-progress: cancelling a run that has already
    # reached `kubectl apply` mid-flight can leave a Deployment rollout
    # partially applied. A newer push queues behind an in-progress apply
    # instead of aborting it; GitHub Actions has no "no runner available"
    # failure state, so queuing here costs nothing but a short wait.
    concurrency:
      group: deploy-apply-${{ github.ref }}
      cancel-in-progress: false
    environment:
      name: production
      url: https://loginid-takehome.uplifttech.org
    steps:
      - uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.34.0 # matches the cluster's server version (uplift-kub, v1.34.10)

      - name: Render manifests for this commit
        run: |
          sed "s/IMAGE_TAG/${{ github.sha }}/g" deploy/manifests.yaml > /tmp/rendered.yaml
          sed "s/IMAGE_TAG/${{ github.sha }}/g" deploy/api-service.yaml > /tmp/rendered-api-service.yaml

      # Backlog Story 13: deploy 34774066342 failed applying the
      # retention-sweep CronJob — PR #57 added `cronjobs` to
      # deploy/rbac.yaml's Role, but rbac.yaml is applied out of band at
      # bootstrap, never by this workflow (the deployer can't grant
      # itself permissions), so the rule existed in git and nowhere
      # else. Same failure class as the ResourceQuota bump in #58's
      # incident: a bootstrap-file change with no apply path, silent
      # until a real deploy needs the new permission. This preflight
      # catches that gap BEFORE any apply, not after a failed one: every
      # distinct `kind` in the rendered manifests must have a matching
      # resource in what the deployer can actually do in this namespace,
      # or the deploy fails loudly here with a message naming the fix,
      # instead of failing deep inside `kubectl apply` with a generic
      # "forbidden" that doesn't say why.
      - name: Preflight — deployer RBAC covers every kind in this deploy
        run: |
          kubectl auth can-i --list -n loginid-takehome > /tmp/can-i.txt
          python3 - <<'PYEOF'
          import re
          import sys

          # Kubernetes' plural-resource-name convention: kind.lower() + 's',
          # with the irregulars this project's manifests actually use.
          IRREGULAR = {
              "NetworkPolicy": "networkpolicies",
              "Ingress": "ingresses",
              "ResourceQuota": "resourcequotas",
          }

          def resource_name(kind: str) -> str:
              return IRREGULAR.get(kind, kind.lower() + "s")

          kinds = set()
          for path in ("/tmp/rendered.yaml", "/tmp/rendered-api-service.yaml"):
              for line in open(path):
                  m = re.match(r"^kind:\s*(\S+)\s*$", line)
                  if m:
                      kinds.add(m.group(1))

          can_i = open("/tmp/can-i.txt").read()
          # Each "Resources" column entry is "resourcename" or
          # "resourcename.apigroup" — match on the bare resource name
          # ignoring the group suffix, since a namespaced Role's `can-i
          # --list` output doesn't always spell the group the same way
          # a manifest's apiVersion does.
          resources_grantable = set(
              re.match(r"^([a-z0-9-]+)", entry).group(1)
              for entry in re.findall(r"^(\S+\.?\S*)\s", can_i, re.MULTILINE)
              if re.match(r"^[a-z]", entry)
          )

          missing = []
          for kind in sorted(kinds):
              resource = resource_name(kind)
              if resource not in resources_grantable:
                  missing.append(f"{kind} (resource: {resource})")

          if missing:
              print("::error::deploy/rbac.yaml drift: bootstrap apply required")
              print("The following kinds appear in this deploy's rendered manifests")
              print("but the deployer's current RBAC (kubectl auth can-i --list) has")
              print("no matching grant — deploy/rbac.yaml was changed in git but never")
              print("applied out of band (rbac.yaml is bootstrap, not CI-applied):")
              for m in missing:
                  print(f"  - {m}")
              sys.exit(1)
          print("Preflight OK: every kind in this deploy has a matching RBAC grant.")
          PYEOF

      - name: Show planned change (kubectl diff)
        run: |
          kubectl diff -f /tmp/rendered.yaml || true
          kubectl diff -f /tmp/rendered-api-service.yaml || true

      # Job pod templates are immutable — delete the previous run before
      # applying a new image tag. --ignore-not-found so the very first
      # deploy (no db-migrate Job yet) doesn't fail here.
      - name: Delete previous migration Job
        run: kubectl -n loginid-takehome delete job db-migrate --ignore-not-found

      # Everything except api-service: Postgres, the migration Job, the
      # issuer/connector, NetworkPolicies, Ingress. api-service is applied
      # separately below, after the migration Job completes (LT-52).
      - name: Apply manifests (excluding api-service)
        run: kubectl apply -f /tmp/rendered.yaml

      - name: Wait for Postgres to be ready
        run: kubectl -n loginid-takehome rollout status statefulset/postgres --timeout=180s

      # `kubectl wait --for=condition=complete` does NOT fail fast on a
      # Failed Job — verified empirically against the real cluster (a
      # deliberately failing Job in a scratch namespace): it waits out the
      # full --timeout regardless, then exits non-zero as a timeout, not
      # as a detected failure. That still stops this workflow before
      # api-service is applied (the safety property holds), but wastes
      # the whole timeout on every real migration failure. Poll both
      # conditions explicitly instead, so a genuine Failed exits within
      # seconds of backoffLimit being exhausted.
      - name: Wait for migration Job to complete
        run: |
          for i in $(seq 1 90); do
            # Multiple conditions can be True at once (e.g. "SuccessCriteriaMet
            # Complete", verified against the real cluster) — the jsonpath
            # below returns a space-separated list, so this must be a word
            # match, never exact string equality (an earlier version of this
            # script used `= "Complete"` and would never have matched).
            conditions=$(kubectl -n loginid-takehome get job db-migrate -o jsonpath='{.status.conditions[?(@.status=="True")].type}')
            case " $conditions " in
              *" Complete "*)
                echo "db-migrate: Complete"
                exit 0
                ;;
              *" Failed "*)
                echo "::error::db-migrate Job failed"
                kubectl -n loginid-takehome logs job/db-migrate --all-containers --tail=200
                exit 1
                ;;
            esac
            sleep 2
          done
          echo "::error::db-migrate did not reach Complete or Failed within the timeout"
          exit 1

      - name: Apply api-service
        run: kubectl apply -f /tmp/rendered-api-service.yaml

      - name: Wait for rollout
        run: |
          kubectl -n loginid-takehome rollout status deployment/api-service --timeout=120s
          kubectl -n loginid-takehome rollout status deployment/api-service-issuer --timeout=120s
          kubectl -n loginid-takehome rollout status deployment/idp-connector --timeout=120s

      - name: Print deploy summary
        run: |
          echo "## Deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Public URL:** https://loginid-takehome.uplifttech.org/healthz" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Commit:** ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Author:** ${{ github.event.head_commit.author.name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          curl -s https://loginid-takehome.uplifttech.org/healthz >> "$GITHUB_STEP_SUMMARY" || echo "(curl failed — DNS may not have propagated yet)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
