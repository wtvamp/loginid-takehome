name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

# Until the loginid-takehome runner set is installed, the `deploy` job
# below queues indefinitely (no matching self-hosted runner exists yet) —
# that's expected, not a failure; GitHub Actions has no "no runner
# available" error state, a job just waits. This concurrency group keeps
# that wait bounded to the most recent push instead of piling up one
# queued run per merge in the meantime: a newer push cancels an older
# queued/running deploy for the same branch.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ghcr.io/${{ github.repository }}

jobs:
  build-and-push:
    name: Build and push images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api-service, idp-connector]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: cmd/${{ matrix.service }}/Dockerfile
          push: true
          build-args: |
            COMMIT_SHA=${{ github.sha }}
          tags: |
            ${{ env.IMAGE_BASE }}/${{ matrix.service }}:${{ github.sha }}
            ${{ env.IMAGE_BASE }}/${{ matrix.service }}:latest

  deploy:
    name: Apply manifests to the lab cluster
    runs-on: loginid-takehome
    needs: [build-and-push]
    environment:
      name: production
      url: https://loginid-takehome.uplifttech.org
    steps:
      - uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.34.0 # matches the cluster's server version (uplift-kub, v1.34.10)

      - name: Render manifests for this commit
        run: sed "s/IMAGE_TAG/${{ github.sha }}/g" deploy/manifests.yaml > /tmp/rendered.yaml

      - name: Show planned change (kubectl diff)
        run: kubectl diff -f /tmp/rendered.yaml || true

      - name: Apply manifests
        run: kubectl apply -f /tmp/rendered.yaml

      - name: Wait for rollout
        run: |
          kubectl -n loginid-takehome rollout status deployment/api-service --timeout=120s
          kubectl -n loginid-takehome rollout status deployment/idp-connector --timeout=120s

      - name: Print deploy summary
        run: |
          echo "## Deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Public URL:** https://loginid-takehome.uplifttech.org/healthz" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Commit:** ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Author:** ${{ github.event.head_commit.author.name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          curl -s https://loginid-takehome.uplifttech.org/healthz >> "$GITHUB_STEP_SUMMARY" || echo "(curl failed — DNS may not have propagated yet)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
