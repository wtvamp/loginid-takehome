        - heading "Drive the real API yourself" [level=2] [ref=e88]
      - paragraph [ref=e89]:
        - text: "The assignment asked for three things: a multi-database DAO, a secured REST service to search and retrieve profiles, and a connector to a third-party identity provider. All three are running right now on a Kubernetes cluster."
        - link "The demo console" [ref=e90] [cursor=pointer]:
          - /url: https://loginid-takehome.uplifttech.org/demo
        - text: is a single page served by the API binary itself, on the same origin, so it holds no secret and needs no CORS. It makes real calls with a real token and prints the request as a curl line beside the raw response.
    - generic [ref=e91]:
      - generic [ref=e92]:
        - heading "What you can try with no credentials at all" [level=3] [ref=e93]
        - paragraph [ref=e94]: Open these in any browser, right now.
        - generic [ref=e95]:
          - generic [ref=e97]:
            - heading "The health endpoint" [level=4] [ref=e98]
            - paragraph [ref=e99]: Reports the build SHA running in the cluster and whether the database connection is live. The SHA always matches the tip of main, because deployment is the only way code reaches the cluster.
            - generic [ref=e100]: "curl -s https://loginid-takehome.uplifttech.org/healthz {\"status\":\"ok\",\"service\":\"api-service\",\"build\":\"â€¦\",\"db\":\"ok\"}"
          - generic [ref=e102]:
            - heading "The refusal to answer without a token" [level=4] [ref=e103]
            - paragraph [ref=e104]: Panel 3 on the demo page needs nothing from you. An unauthenticated read returns 401 with no hint about whether the record exists.
            - generic [ref=e105]: curl -i https://loginid-takehome.uplifttech.org/profiles/00000000-0000-4000-8000-000000000001 HTTP/2 401
        - paragraph [ref=e106]: Everything else needs a token, because the API has no anonymous read path. That is the design, not a gate on the demo.
      - generic [ref=e107]:
        - heading "Getting a credential" [level=3] [ref=e108]
        - paragraph [ref=e109]: Three QA client credentials exist, each granted exactly one scope.
        - table [ref=e111]:
          - rowgroup [ref=e112]:
            - row [ref=e113]:
              - columnheader "Credential" [ref=e114]
