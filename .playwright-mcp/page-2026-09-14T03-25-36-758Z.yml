        - text: The same thing, in pictures
        - heading "What the product owner saw when she signed it off" [level=3] [ref=e179]
      - paragraph [ref=e180]: "The console was the forty-third and last story, pulled after the backlog had already closed because a reviewer should be able to see the thing work, not read that it works. The human added one requirement: make sure it looks good."
