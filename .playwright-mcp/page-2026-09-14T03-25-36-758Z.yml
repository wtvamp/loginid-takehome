    - generic [ref=e1303]:
      - generic [ref=e1304]:
        - text: Software architecture
        - heading "What runs in the namespace" [level=2] [ref=e1305]
      - paragraph [ref=e1306]: "Two Go binaries in three images. Watch the requests: a client mints a token at the issuer, calls the verifier, which checks the JWKS in-cluster and reads Postgres; the verifier alone may reach the connector; Vault feeds every pod its secrets at start. Hover a node for what it does."
    - generic [ref=e1309]:
      - generic [ref=e1310]: client request
      - generic [ref=e1312]: JWKS / Vault
      - generic [ref=e1314]: database
      - generic [ref=e1316]: denied by NetworkPolicy
    - generic [ref=e1318]:
      - generic [ref=e1319]:
        - heading "Q1 Â· Data access" [level=3] [ref=e1320]
        - paragraph [ref=e1321]: DAO for user_profile and user_credential
        - paragraph [ref=e1322]: One Repository interface, three backends. A conformance suite runs identical assertions against real Postgres, CockroachDB, and SQLite containers in CI, including CockroachDB's serialization retry. Errors by SQLSTATE, never by message text.
      - generic [ref=e1323]:
        - heading "Q2 Â· REST + auth" [level=3] [ref=e1324]
        - paragraph [ref=e1325]: Search and retrieve, secured
        - paragraph [ref=e1326]: OAuth2 client credentials mint RS256 tokens with per-client audiences; the verifier checks issuer, audience, and JWKS with bounded staleness. Masked search; full reads need read:own or read:any with a closed reason code; scope and policy denials are byte-identical 403s.
      - generic [ref=e1327]:
        - heading "Q3 Â· IDP connector" [level=3] [ref=e1328]
        - paragraph [ref=e1329]: /auth and /identity to a vendor
        - paragraph [ref=e1330]: Vendor tokens fetched, used once, discarded. Uniform-timing failures, per-identity and overflow backoff; the failure-ratio limiter fired live in review. Reachable only from api-service.
  - generic [ref=e1331]:
    - generic [ref=e1332]:
      - generic [ref=e1333]:
        - text: AI architecture
        - heading "How the work was actually organised" [level=2] [ref=e1334]
      - paragraph [ref=e1335]: "LoginID asked which AI tools were used and how. The honest answer is longer than a tool name, so this section gives the whole design: the layers, the model chosen for each seat and why, the rules that kept the agents from simply agreeing with each other, and a plain statement of which parts are Anthropic's documented patterns and which parts this project invented."
    - generic [ref=e1336]:
      - generic [ref=e1337]:
        - generic [ref=e1338]:
          - generic [ref=e1339]: The tool
          - generic [ref=e1340]: Claude Code
        - paragraph [ref=e1341]: "Anthropic's agentic command-line tool, chosen because the deliverable is itself an argument about AI-architecture judgement. Using the tool that is the subject of the question makes the workflow inspectable: every session was recorded, and those recordings are published further down this page."
      - generic [ref=e1342]:
        - generic [ref=e1343]:
          - generic [ref=e1344]: The briefs
          - generic [ref=e1345]: one root file, five track files
        - paragraph [ref=e1346]: "A root brief carries the assignment, the track boundaries and the working rules. Each of the five track directories carries its own brief, written to be self-sufficient: a fresh agent with no history can pick up that track from those two files alone. Context is retrieved when it is needed rather than all loaded at once, which is how a thirty-hour project stays inside a context window."
      - generic [ref=e1347]:
        - generic [ref=e1348]:
          - generic [ref=e1349]: The sessions
          - generic [ref=e1350]: six top-level processes, not one
        - paragraph [ref=e1351]: The project manager ran as one process. Each of the five track leads ran as its own separate process in its own terminal window, loading only its own brief and its own persona. They spoke to each other by message, but handed work over as files. A message signals that something is ready; it never carries the content.
      - generic [ref=e1352]:
        - generic [ref=e1353]:
          - generic [ref=e1354]: The hires
          - generic [ref=e1355]: eighteen specialists, spawned by their lead
        - paragraph [ref=e1356]: Each lead hired three or four specialists as sub-processes of its own session. Hires returned prose to their lead; leads wrote the files. Hires never spawned further agents, so the tree is exactly three deep and no work was ever orphaned under an agent nobody was watching.
      - generic [ref=e1357]:
        - generic [ref=e1358]:
          - generic [ref=e1359]: The operator
          - generic [ref=e1360]: an agent on another machine, holding the credentials
        - paragraph [ref=e1361]: Cluster and DNS credentials were never in this project's reach. A separate long-running agent on a different machine held them, took written requests, verified each one against the live cluster before acting, and refused anything the human had not authorised.
    - generic [ref=e1362]:
      - generic [ref=e1363]:
        - heading "Which model sat in which seat, and why" [level=3] [ref=e1364]
        - paragraph [ref=e1365]: One expensive seat where a wrong call propagates; capable, cheaper models everywhere the work is bounded.
