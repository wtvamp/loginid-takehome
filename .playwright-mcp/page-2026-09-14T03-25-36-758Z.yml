      - generic [ref=e1754]:
        - generic [ref=e1755]: Arithmetic outlives its assumption
        - paragraph [ref=e1756]: An alert at window-plus-one-interval fired on every healthy cycle; a rolling-day skip rate was meaningless at a daily schedule. Both became functions of one interval constant.
