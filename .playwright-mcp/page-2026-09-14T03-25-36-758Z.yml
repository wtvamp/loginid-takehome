        - paragraph [ref=e1394]: "The security lead wrote that reasoning up before any of it ran, then recorded where the harness refused to cooperate: there is no per-agent effort setting, so the planned middle tier collapsed upward. The plan says so rather than pretending the design survived contact intact."
      - generic [ref=e1395]:
        - heading "Why the agents were given different personalities" [level=3] [ref=e1396]
        - paragraph [ref=e1397]: Not decoration. A countermeasure against a specific failure.
        - paragraph [ref=e1398]: "Five leads and a manager, all started from the same base model, land in the same temperament by default: serious, careful, thorough. Agreement between agents who think alike is not evidence that a decision is good. It is evidence that nobody in the room was built to disagree."
        - paragraph [ref=e1399]: So variance was engineered. Thirteen archetypes, each with a stated blind spot. No archetype more than twice across the whole organisation and never twice inside one team. Every team had to contain its own lead's temperament opposite. At least three hires had to be playful and bold, because not one lead was. Each hire's brief states plainly what it pushes back on and where its own judgement fails.
        - paragraph [ref=e1400]: "The effect is visible in the record: the adversary keeps finding attacks, the minimalist keeps deleting scope, and the newcomer keeps asking the question everyone else had stopped asking."
