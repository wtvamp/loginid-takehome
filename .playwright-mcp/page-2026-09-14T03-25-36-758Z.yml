            - row [ref=e122]:
              - cell "QA read-own client" [ref=e123]
              - cell "profile:read:own" [ref=e124]
              - cell "Read only records this client owns. Used to produce the two identical 403s." [ref=e125]
            - row [ref=e126]:
              - cell "QA read-any client" [ref=e127]
