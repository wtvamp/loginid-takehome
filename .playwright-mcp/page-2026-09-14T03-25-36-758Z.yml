      - figure "Three single-scope tokens live, then one profile read two ways. Masked fields are tagged in the response itself." [ref=e182]:
        - 'img "Demo console: three tokens minted, then the same profile returned masked under profile:search and unmasked under profile:read:any"'
      - figure "The two 403s compared byte for byte on the page. Below them the 401, and the reason code accepted then refused." [ref=e184]:
