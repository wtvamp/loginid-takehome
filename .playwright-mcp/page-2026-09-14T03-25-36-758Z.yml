        - generic [ref=e1743]: Config named, never set
        - paragraph [ref=e1744]: Three times a binary read an environment variable no manifest set. Now every mode declares its required variables, refuses to start without them, and CI diffs manifests against that list.
      - generic [ref=e1745]:
        - generic [ref=e1746]: A pattern not carried forward
        - paragraph [ref=e1747]: "Five times a control on one component was missing on an identical new one: NetworkPolicy allow-lists, Forbid on a CronJob, a ServiceAccount per workload. Each got a test tying the new component to the rule."
      - generic [ref=e1748]:
        - generic [ref=e1749]: Verification that skips
