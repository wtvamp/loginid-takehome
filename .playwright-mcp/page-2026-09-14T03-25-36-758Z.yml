        - generic [ref=e130]:
          - generic [ref=e131]: The secrets are not on this page, deliberately
          - paragraph [ref=e132]: A client secret is the password half of an OAuth2 client credential. Publishing one on a public page would contradict every control this submission argues for. The three id and secret pairs are sent separately, in the email that carries this link. Each is single-scope, low value, and revocable in one SQL statement.
    - generic [ref=e133]:
      - heading "Running the console, step by step" [level=3] [ref=e134]
      - paragraph [ref=e135]: "About four minutes. Nothing you type is stored: the credential lives in the browser tab and dies with it."
      - generic [ref=e136]:
        - generic [ref=e138]:
          - heading "Open the console" [level=4] [ref=e139]
          - paragraph [ref=e140]:
            - text: Go to
            - link "loginid-takehome.uplifttech.org/demo" [ref=e141] [cursor=pointer]:
              - /url: https://loginid-takehome.uplifttech.org/demo
            - text: . You will see one credential box at the top and five numbered panels below it, each with its own Run button.
        - generic [ref=e143]:
          - heading "Mint your first token" [level=4] [ref=e144]
          - paragraph [ref=e145]: Paste the QA search client id into QA client id and its secret into QA client secret, then press Mint token. A green chip appears reading profile:search âœ“ live. The page shows you the exact request it just made.
          - generic [ref=e146]: "POST /auth/token Authorization: Basic <client-id>:<client-secret> Content-Type: application/x-www-form-urlencoded grant_type=client_credentials"
          - paragraph [ref=e147]: There is no scope parameter to send. The scope is a property of the credential, stored server-side, so a caller cannot ask for more than it was granted. Tokens last ten minutes; if one expires mid-review the page tells you to mint another rather than showing you a bare 401.
        - generic [ref=e149]:
          - heading "Repeat for the other two credentials" [level=4] [ref=e150]
          - paragraph [ref=e151]: Paste the read-own pair, mint; paste the read-any pair, mint. You now hold three live tokens, one per scope, and three green chips. Clearing the fields does not clear the tokens.
        - generic [ref=e153]:
          - heading "Panel 1 â€” masked search beside full read" [level=4] [ref=e154]
          - paragraph [ref=e155]: "Leave the search box at its default, Review Demo, and press Run. Three fictional records come back: Review Demo One, Two and Three. In the left-hand response, phone and region are masked and highlighted as such. The page then re-reads the same record with the read-any token, and the right-hand response shows those fields in full."
          - paragraph [ref=e156]: The point is that authorisation is graduated, not a switch. The same row, the same handler, two different callers, two different shapes of truth.
          - generic [ref=e157]: "POST /profiles/search Authorization: Bearer <profile:search token> {\"name\": \"Review Demo\"} GET /profiles/{id} Authorization: Bearer <profile:read:any token>"
        - generic [ref=e159]:
          - heading "Panel 2 â€” the two identical 403s" [level=4] [ref=e160]
          - paragraph [ref=e161]: "Press Run. The page requests two record ids the read-own credential was never granted: one that exists and one that almost certainly does not. Both come back 403 with the same 65-byte body, and the page compares them byte for byte in front of you and prints PASS."
          - paragraph [ref=e162]: If "you may not see this" and "this does not exist" looked different, an attacker could enumerate which customers are real by reading error messages. They do not look different.
        - generic [ref=e164]:
          - heading "Panel 3 â€” no token at all" [level=4] [ref=e165]
          - paragraph [ref=e166]: Press Run with nothing minted. 401. There is no anonymous back door, including on the search path.
        - generic [ref=e168]:
          - heading "Panel 4 â€” the reason-code enum" [level=4] [ref=e169]
          - paragraph [ref=e170]: "Press Run. A full read is attempted twice with the read-any token: once carrying reason_code=support_ticket, which is on the server's closed list and is accepted, and once carrying reason_code=made_up_reason, which is rejected."
          - paragraph [ref=e171]: An unmasked read of someone's home address should require a stated, checkable purpose that gets written to the audit log. A free-text field would let the caller write anything; a closed enum will not.
        - generic [ref=e173]:
          - heading "Panel 5 â€” tripping the rate limiter, for real" [level=4] [ref=e174]
          - paragraph [ref=e175]: Run this one last. The page fires real requests one at a time until the API answers 429, then stops. The limiter is shared across everyone using that QA credential, so if a colleague is on the page at the same moment you will both feel it. That is stated on the page rather than hidden behind a per-visitor sandbox.
      - paragraph [ref=e176]: Prefer a terminal? Every request above is printed on the page as a copyable curl line, so the console doubles as documentation for the API.
